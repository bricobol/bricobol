<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion BricoBol</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">🧰</div>
    <div class="sidebar-logo-text">
      <strong>Gestion BricoBol</strong>
      <small>Espace bureau</small>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <span>v0.5</span>
    <span id="storageInfo">Supabase</span>
  </div>
</aside>

<div class="overlay" id="overlay" onclick="BricoBol.closeSidebar()"></div>

<main class="main">
  <header class="topbar">
    <button class="burger-btn" onclick="BricoBol.toggleSidebar()" aria-label="Menu">☰</button>
    <h1 class="topbar-title" id="topbarTitle">Tableau de bord</h1>
    <button id="btnRecharger" onclick="BricoBol.recharger()" title="Recharger depuis le serveur" style="background:none;border:none;font-size:1.3rem;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--text);">🔄</button>
  </header>

  <div id="pauseBandeau" style="display:none;"></div>
  <div id="syncBandeau" style="display:none;"></div>

  <div class="content" id="contentArea"></div>
</main>
</div>

<div id="modalsContainer"></div>

<!-- Modale de connexion Supabase -->
<div id="supaLoginModal" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:3rem;">🧰</div>
      <h1 style="margin:12px 0 4px;font-size:1.4rem;font-weight:800;">Gestion BricoBol</h1>
      <p style="color:#64748b;font-size:.85rem;margin:0;">Connexion requise</p>
    </div>
    <form id="supaLoginForm">
      <div style="margin-bottom:14px;">
        <label style="display:block;font-weight:600;font-size:.82rem;margin-bottom:6px;">Email</label>
        <input type="email" id="supaEmail" required autocomplete="username" style="width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:inherit;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-weight:600;font-size:.82rem;margin-bottom:6px;">Mot de passe</label>
        <input type="password" id="supaPassword" required autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:inherit;">
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:16px;cursor:pointer;">
        <input type="checkbox" id="supaSouvenir" checked style="width:auto;">
        <span>Se souvenir de moi sur cet appareil</span>
      </label>
      <div id="supaLoginError" style="display:none;padding:10px;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:.85rem;margin-bottom:14px;"></div>
      <button type="submit" id="supaLoginBtn" style="width:100%;padding:14px;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;">
        Se connecter
      </button>
    </form>
  </div>
</div>

<div class="gps-popup" id="gpsPopup">
  <h3>Ouvrir l'itinéraire avec…</h3>
  <a href="#" id="gpsGoogleMaps" target="_blank">🗺️ Google Maps</a>
  <a href="#" id="gpsWaze" target="_blank">🚗 Waze</a>
  <a href="#" id="gpsAppleMaps" target="_blank">🍎 Apple Plans</a>
  <button class="btn btn-ghost" onclick="BricoBol.closeGpsPopup()" style="margin-top:8px;width:100%;">Annuler</button>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>

<script src="js/module-dashboard.js"></script>
<script src="js/module-tournee.js"></script>
<script src="js/module-missions.js"></script>
<script src="js/module-adherents.js"></script>
<script src="js/module-formulaire.js"></script>
<script src="js/module-interventions.js"></script>
<script src="js/module-agenda.js"></script>
<script src="js/module-frais.js"></script>
<script src="js/module-cotisations.js"></script>
<script src="js/module-dons.js"></script>
<script src="js/module-comptabilite.js"></script>
<script src="js/module-documents.js"></script>
<script src="js/module-parametres.js"></script>

<!-- Service Worker (PWA) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('✅ Service Worker enregistré'))
      .catch(err => console.warn('⚠️ Service Worker:', err));
  });
}
</script>

</body>
</html>
