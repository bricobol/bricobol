  onShow() { this.render(); }
};

Router.register({
  view: 'interventions',
  title: 'Interventions',
  icon: '🛠️',
  section: 'Activité',
  order: 2,
  getViewHTML: () => Interventions.getViewHTML(),
  getModalsHTML: () => Interventions.getModalsHTML(),
  onShow: () => Interventions.onShow()
});
</script>
<script>
// ============================================================
// MODULE : AGENDA — Vue jour/semaine/mois + événements
// ============================================================

const Agenda = {

  currentView: 'jour', // jour | semaine | mois
  currentDate: new Date(),
  filterBenevole: '',
  filterStatut: '',

  // ---------- Données ----------
  getEvenements() { return Storage.get('evenements', []); },
  saveEvenements(list) { return Storage.set('evenements', list); },

  // Récupère toutes les interventions avec date prévue
  getInterventionsPlanifiees() {
    return Interventions.getAll().filter(i => i.datePrevue && i.statut !== 'annulee');
  },

  // Récupère tous les items (interventions + événements) sur une période
  getItemsBetween(startDate, endDate) {
    const items = [];
    // Interventions
    this.getInterventionsPlanifiees().forEach(i => {
      const d = i.datePrevue;
      if (!d) return;
      if (d >= startDate && d <= endDate) {
        if (this.filterBenevole && (i.benevole || '').toLowerCase().indexOf(this.filterBenevole.toLowerCase()) === -1) return;
        if (this.filterStatut && i.statut !== this.filterStatut) return;
        items.push({
          type: 'intervention',
          id: i.id,
          numero: i.numero,
          titre: i.type,
          demandeur: i.demandeur,
          benevole: i.benevole,
          date: i.datePrevue,
          heure: i.heurePrevue || '',
          statut: i.statut,
          couleur: Interventions.STATUTS[i.statut]?.color || '#2563eb',
          badge: Interventions.STATUTS[i.statut]?.label || '',
          urgent: i.priorite === 'urgente'
        });
      }
    });
    // Événements
    this.getEvenements().forEach(e => {
      if (!e.date) return;
      if (e.date >= startDate && e.date <= endDate) {
        items.push({
          type: 'evenement',
          id: e.id,
          titre: e.titre,
          description: e.description || '',
          date: e.date,
          heure: e.heure || '',
          heureFin: e.heureFin || '',
          couleur: e.couleur || '#8b5cf6',
          badge: e.typeEvenement || 'Événement'
        });
      }
    });
    items.sort((a, b) => {
      const ka = `${a.date} ${a.heure || '00:00'}`;
      const kb = `${b.date} ${b.heure || '00:00'}`;
      return ka.localeCompare(kb);
    });
    return items;
  },

  // ---------- Utilitaires dates ----------
  toISODate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },

  startOfWeek(d) {
    const date = new Date(d);
    const day = date.getDay() || 7;
    date.setDate(date.getDate() - day + 1);
    date.setHours(0, 0, 0, 0);
    return date;
  },

  endOfWeek(d) {
    const date = this.startOfWeek(d);
    date.setDate(date.getDate() + 6);
    return date;
  },

  startOfMonth(d) {
    return new Date(d.getFullYear(), d.getMonth(), 1);
  },

  endOfMonth(d) {
    return new Date(d.getFullYear(), d.getMonth() + 1, 0);
  },

  formatMois(d) {
    const mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    return `${mois[d.getMonth()]} ${d.getFullYear()}`;
  },

  formatJourCourt(d) {
    const jours = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    return jours[d.getDay()];
  },

  // ---------- Navigation ----------
  goToday() {
    this.currentDate = new Date();
    this.render();
  },

  prev() {
    if (this.currentView === 'jour') this.currentDate.setDate(this.currentDate.getDate() - 1);
    else if (this.currentView === 'semaine') this.currentDate.setDate(this.currentDate.getDate() - 7);
    else this.currentDate.setMonth(this.currentDate.getMonth() - 1);
    this.render();
  },

  next() {
    if (this.currentView === 'jour') this.currentDate.setDate(this.currentDate.getDate() + 1);
    else if (this.currentView === 'semaine') this.currentDate.setDate(this.currentDate.getDate() + 7);
    else this.currentDate.setMonth(this.currentDate.getMonth() + 1);
    this.render();
  },

  setView(view) {
    this.currentView = view;
    this.render();
  },

  // ---------- Rendu principal ----------
  render() {
    const container = document.getElementById('agendaContainer');
    const titre = document.getElementById('agendaTitre');
    if (!container || !titre) return;

    // Titre selon la vue
    if (this.currentView === 'jour') {
      titre.textContent = this.currentDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } else if (this.currentView === 'semaine') {
      const sw = this.startOfWeek(this.currentDate);
      const ew = this.endOfWeek(this.currentDate);
      titre.textContent = `Semaine du ${Utils.formatDate(this.toISODate(sw))} au ${Utils.formatDate(this.toISODate(ew))}`;
    } else {
      titre.textContent = this.formatMois(this.currentDate);
    }

    // Boutons actifs
    ['jour', 'semaine', 'mois'].forEach(v => {
      const btn = document.getElementById('agendaBtn' + v.charAt(0).toUpperCase() + v.slice(1));
      if (btn) btn.classList.toggle('active', this.currentView === v);
    });

    // Rendu selon la vue
    if (this.currentView === 'jour') this.renderJour(container);
    else if (this.currentView === 'semaine') this.renderSemaine(container);
    else this.renderMois(container);

    // Notifications
    this.checkNotifications();
  },

  renderJour(container) {
    const iso = this.toISODate(this.currentDate);
    const items = this.getItemsBetween(iso, iso);

    if (items.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:var(--text-light);">
          <div style="font-size:3rem;margin-bottom:12px;">📭</div>
          <p>Aucun élément prévu ce jour.</p>
          <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <button class="btn" onclick="Interventions.openFormFromAgenda('${iso}', '')">➕ Intervention</button>
            <button class="btn btn-ghost" onclick="Agenda.openEvenementForm(null, '${iso}')">➕ Événement</button>
          </div>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="btn" style="flex:1;" onclick="Interventions.openFormFromAgenda('${iso}', '')">➕ Intervention</button>
        <button class="btn btn-ghost" style="flex:1;" onclick="Agenda.openEvenementForm(null, '${iso}')">➕ Événement</button>
      </div>
      ${items.map(it => this.renderItemCard(it)).join('')}
    `;
  },

  renderItemCard(it) {
    if (it.type === 'intervention') {
      const isToday = it.date === Utils.todayISO();
      const overdue = it.date < Utils.todayISO() && it.statut !== 'terminee';
      return `
        <div class="agenda-item" style="border-left:4px solid ${it.couleur};padding:12px;background:#fff;border-radius:10px;margin-bottom:8px;cursor:pointer;" onclick="Interventions.openDetail(${it.id})">
          <div style="display:flex;justify-content:space-between;align-items:start;">
            <div style="flex:1;">
              <div style="font-weight:700;font-size:.95rem;">
                ${it.heure ? `<span style="color:var(--accent);">${it.heure}</span> · ` : ''}${Utils.escapeHtml(it.titre)}
                ${it.urgent ? '<span class="badge badge-danger" style="font-size:.65rem;margin-left:6px;">URGENT</span>' : ''}
              </div>
              <div style="font-size:.82rem;color:var(--text-light);margin-top:4px;">
                👤 ${Utils.escapeHtml(it.demandeur)}
                ${it.benevole ? ' · 🤝 ' + Utils.escapeHtml(it.benevole) : ''}
              </div>
              <div style="margin-top:6px;font-size:.75rem;">
                <span class="badge" style="background:${it.couleur}22;color:${it.couleur};">${it.badge}</span>
                ${overdue ? '<span class="badge badge-danger" style="font-size:.65rem;margin-left:4px;">En retard</span>' : ''}
                ${isToday ? '<span class="badge badge-info" style="font-size:.65rem;margin-left:4px;">Aujourd\'hui</span>' : ''}
              </div>
            </div>
            <div style="font-size:.75rem;color:var(--accent);font-weight:600;">${Utils.escapeHtml(it.numero)}</div>
          </div>
        </div>`;
    } else {
      return `
        <div class="agenda-item" style="border-left:4px solid ${it.couleur};padding:12px;background:#faf5ff;border-radius:10px;margin-bottom:8px;cursor:pointer;" onclick="Agenda.openEvenementForm(${it.id})">
          <div style="display:flex;justify-content:space-between;align-items:start;">
            <div>
              <div style="font-weight:700;font-size:.95rem;">
                ${it.heure ? `<span style="color:${it.couleur};">${it.heure}${it.heureFin ? ' - ' + it.heureFin : ''}</span> · ` : ''}${Utils.escapeHtml(it.titre)}
              </div>
              ${it.description ? `<div style="font-size:.82rem;color:var(--text-light);margin-top:4px;white-space:pre-wrap;">${Utils.escapeHtml(it.description.substring(0, 100))}${it.description.length > 100 ? '…' : ''}</div>` : ''}
              <div style="margin-top:6px;"><span class="badge" style="background:${it.couleur}22;color:${it.couleur};">${it.badge}</span></div>
            </div>
            <span style="font-size:1.2rem;">📅</span>
          </div>
        </div>`;
    }
  },

  renderSemaine(container) {
    const sw = this.startOfWeek(this.currentDate);
    const jours = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(sw);
      d.setDate(d.getDate() + i);
      jours.push(d);
    }
    const isoStart = this.toISODate(jours[0]);
    const isoEnd = this.toISODate(jours[6]);
    const items = this.getItemsBetween(isoStart, isoEnd);

    const isoAujourdhui = Utils.todayISO();
    const grid = jours.map(d => {
      const iso = this.toISODate(d);
      const itemsJour = items.filter(it => it.date === iso);
      const isToday = iso === isoAujourdhui;
      return `
        <div style="min-width:140px;flex:1;background:${isToday ? '#eff6ff' : '#fff'};border-radius:10px;border:1px solid ${isToday ? 'var(--accent)' : 'var(--border)'};padding:8px;">
          <div style="text-align:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">
            <div style="font-size:.72rem;color:var(--text-light);text-transform:uppercase;font-weight:700;">${this.formatJourCourt(d)}</div>
            <div style="font-size:1.1rem;font-weight:800;color:${isToday ? 'var(--accent)' : 'inherit'};">${d.getDate()}</div>
          </div>
          ${itemsJour.length === 0
            ? `<div style="text-align:center;color:var(--text-light);font-size:.78rem;padding:8px 0;">—</div>`
            : itemsJour.map(it => `
              <div style="padding:6px;border-radius:6px;background:${it.couleur}15;border-left:3px solid ${it.couleur};margin-bottom:4px;font-size:.75rem;cursor:pointer;"
                   onclick="${it.type === 'intervention' ? `Interventions.openDetail(${it.id})` : `Agenda.openEvenementForm(${it.id})`}">
                ${it.heure ? `<strong>${it.heure}</strong> ` : ''}${Utils.escapeHtml(it.titre.substring(0, 30))}${it.titre.length > 30 ? '…' : ''}
              </div>`).join('')}
        </div>`;
    }).join('');

    container.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn" onclick="Interventions.openFormFromAgenda('${Utils.todayISO()}', '')">➕ Intervention</button>
        <button class="btn btn-ghost" onclick="Agenda.openEvenementForm(null, '${Utils.todayISO()}')">➕ Événement</button>
      </div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;">
        ${grid}
      </div>
    `;
  },

  renderMois(container) {
    const first = this.startOfMonth(this.currentDate);
    const last = this.endOfMonth(this.currentDate);
    const startGrid = this.startOfWeek(first);
    const endGrid = this.endOfWeek(last);
    const items = this.getItemsBetween(this.toISODate(startGrid), this.toISODate(endGrid));
    const isoAujourdhui = Utils.todayISO();

    const cells = [];
    let d = new Date(startGrid);
    while (d <= endGrid) {
      const iso = this.toISODate(d);
      const itemsJour = items.filter(it => it.date === iso);
      const isToday = iso === isoAujourdhui;
      const isCurrentMonth = d.getMonth() === this.currentDate.getMonth();
      cells.push(`
        <div style="min-height:80px;background:${isToday ? '#eff6ff' : (isCurrentMonth ? '#fff' : '#f8fafc')};border:1px solid var(--border);border-radius:8px;padding:4px;cursor:pointer;"
             onclick="Agenda.setDate('${iso}')">
          <div style="font-size:.75rem;font-weight:${isToday ? '800' : '600'};color:${isToday ? 'var(--accent)' : (isCurrentMonth ? 'inherit' : 'var(--text-light)')};margin-bottom:2px;text-align:right;">${d.getDate()}</div>
          ${itemsJour.slice(0, 3).map(it => `
            <div style="height:6px;border-radius:3px;background:${it.couleur};margin-bottom:2px;" title="${Utils.escapeHtml(it.titre)}"></div>
          `).join('')}
          ${itemsJour.length > 3 ? `<div style="font-size:.65rem;text-align:center;color:var(--text-light);">+${itemsJour.length - 3}</div>` : ''}
        </div>`);
      d.setDate(d.getDate() + 1);
    }

    const joursSemaine = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    container.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn" onclick="Interventions.openFormFromAgenda('${Utils.todayISO()}', '')">➕ Intervention</button>
        <button class="btn btn-ghost" onclick="Agenda.openEvenementForm(null, '${Utils.todayISO()}')">➕ Événement</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;">
        ${joursSemaine.map(j => `<div style="text-align:center;font-size:.72rem;font-weight:700;color:var(--text-light);text-transform:uppercase;">${j}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
        ${cells.join('')}
      </div>
    `;
  },

  setDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    this.currentDate = new Date(y, m - 1, d);
    this.currentView = 'jour';
    this.render();
  },

  // ---------- Événements ----------
  openEvenementForm(id = null, presetDate = null) {
    const form = document.getElementById('evenementForm');
    form.reset();
    document.getElementById('evtEditId').value = '';
    document.getElementById('evtFormTitle').textContent = id ? 'Modifier l\'événement' : 'Nouvel événement';
    if (id) {
      const e = this.getEvenements().find(x => x.id === id);
      if (!e) return;
      document.getElementById('evtEditId').value = e.id;
      document.getElementById('evtTitre').value = e.titre || '';
      document.getElementById('evtType').value = e.typeEvenement || 'Réunion';
      document.getElementById('evtDate').value = e.date || '';
      document.getElementById('evtHeure').value = e.heure || '';
      document.getElementById('evtHeureFin').value = e.heureFin || '';
      document.getElementById('evtCouleur').value = e.couleur || '#8b5cf6';
      document.getElementById('evtDescription').value = e.description || '';
    } else {
      document.getElementById('evtDate').value = presetDate || Utils.todayISO();
      document.getElementById('evtType').value = 'Réunion';
      document.getElementById('evtCouleur').value = '#8b5cf6';
    }
    document.getElementById('evtFormModal').classList.add('active');
  },

  closeEvenementForm() { document.getElementById('evtFormModal').classList.remove('active'); },

  saveEvenement(event) {
    event.preventDefault();
    const id = document.getElementById('evtEditId').value;
    const typeEvt = document.getElementById('evtType').value;
    // Couleur auto selon le type (si pas modifiée manuellement)
    const couleurAuto = {
      'Réunion': '#8b5cf6',
      'AG': '#dc2626',
      'Formation': '#0ea5e9',
      'Sortie': '#16a34a',
      'Autre': '#64748b'
    };
    const couleur = document.getElementById('evtCouleur').value || couleurAuto[typeEvt] || '#8b5cf6';
    const data = {
      titre: document.getElementById('evtTitre').value.trim(),
      typeEvenement: typeEvt,
      date: document.getElementById('evtDate').value,
      heure: document.getElementById('evtHeure').value,
      heureFin: document.getElementById('evtHeureFin').value,
      couleur,
      description: document.getElementById('evtDescription').value.trim()
    };
    if (!data.titre || !data.date) { alert('Titre et date obligatoires.'); return; }
    const list = this.getEvenements();
    if (id) {
      const idx = list.findIndex(e => String(e.id) === String(id));
      if (idx !== -1) list[idx] = { ...list[idx], ...data };
    } else {
      list.push({ id: Date.now(), ...data });
    }
    this.saveEvenements(list);
    this.closeEvenementForm();
    this.render();
  },

  removeEvenement(id) {
    const e = this.getEvenements().find(x => x.id === id);
    if (!e) return;
    if (!confirm(`Supprimer l'événement "${e.titre}" ?`)) return;
    this.saveEvenements(this.getEvenements().filter(x => x.id !== id));
    this.closeEvenementForm();
    this.render();
  },

  // ---------- Notifications navigateur ----------
  async requestNotificationPermission() {
    if (!('Notification' in window)) { alert('Votre navigateur ne supporte pas les notifications.'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      alert('✅ Notifications activées. Vous recevrez un rappel quand l\'app est ouverte.');
      this.savePrefs({ notifications: true });
    } else {
      alert('❌ Notifications refusées.');
      this.savePrefs({ notifications: false });
    }
  },

  getPrefs() { return Storage.get('agenda_prefs', { notifications: false, derniereNotifDate: '' }); },
  savePrefs(p) { Storage.set('agenda_prefs', p); },

  checkNotifications() {
    const prefs = this.getPrefs();
    if (!prefs.notifications) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const today = Utils.todayISO();
    if (prefs.derniereNotifDate === today) return;
    const items = this.getItemsBetween(today, today);
    if (items.length === 0) return;

    const nb = items.length;
    const nextItem = items.find(i => i.heure && i.heure >= new Date().toTimeString().substring(0, 5)) || items[0];
    const msg = nextItem.heure
      ? `${nextItem.heure} - ${nextItem.titre}`
      : `${nb} élément(s) prévu(s) aujourd'hui`;

    try {
      new Notification('🧰 Agenda BricoBol', {
        body: msg,
        icon: '/favicon.ico',
        tag: 'bricobol-agenda'
      });
      prefs.derniereNotifDate = today;
      this.savePrefs(prefs);
    } catch (e) { console.error(e); }
  },

  // ---------- Export ICS ----------
  exporterICS() {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//BricoBol//Agenda//FR',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:BricoBol'
    ];

    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;

    const escapeICS = s => String(s || '').replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n');

    // Interventions
    this.getInterventionsPlanifiees().forEach(i => {
      if (!i.datePrevue) return;
      const dateCompact = i.datePrevue.replace(/-/g, '');
      const heure = (i.heurePrevue || '09:00').replace(':', '');
      const heureFin = (i.heureRealisee || this.addHours(i.heurePrevue || '09:00', 1)).replace(':', '');
      const dtStart = `DTSTART:${dateCompact}T${heure}00`;
      const dtEnd = `DTEND:${dateCompact}T${heureFin}00`;
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:int-${i.id}@bricobol`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(dtStart);
      lines.push(dtEnd);
      lines.push(`SUMMARY:${escapeICS('🛠️ ' + i.type + ' - ' + i.demandeur)}`);
      lines.push(`DESCRIPTION:${escapeICS(i.description || '')}${i.benevole ? '\\nBénévole: ' + i.benevole : ''}`);
      lines.push(`LOCATION:${escapeICS('')}`);
      lines.push(`STATUS:${i.statut === 'terminee' ? 'CONFIRMED' : 'TENTATIVE'}`);
      lines.push('END:VEVENT');
    });

    // Événements
    this.getEvenements().forEach(e => {
      if (!e.date) return;
      const dateCompact = e.date.replace(/-/g, '');
      const heure = (e.heure || '09:00').replace(':', '');
      const heureFin = (e.heureFin || this.addHours(e.heure || '09:00', 1)).replace(':', '');
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:evt-${e.id}@bricobol`);
      lines.push(`DTSTAMP:${stamp}`);
      lines.push(`DTSTART:${dateCompact}T${heure}00`);
      lines.push(`DTEND:${dateCompact}T${heureFin}00`);
      lines.push(`SUMMARY:${escapeICS('📅 ' + e.titre)}`);
      lines.push(`DESCRIPTION:${escapeICS(e.description || '')}`);
      lines.push('END:VEVENT');
    });

    lines.push('END:VCALENDAR');
    const ics = lines.join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `bricobol_agenda_${Utils.todayISO()}.ics`;
    link.click();
    URL.revokeObjectURL(link.href);
    alert('✅ Fichier .ics téléchargé.\n\nVous pouvez l\'importer dans Google Calendar, Apple Calendrier ou Proton Calendar.');
  },

  addHours(heure, nb) {
    const [h, m] = heure.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    d.setHours(d.getHours() + nb);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  },

  // ---------- Filtres ----------
  setFilterBenevole(val) { this.filterBenevole = val; this.render(); },
  setFilterStatut(val) { this.filterStatut = val; this.render(); },

 renderFiltres() {
    const dl = document.getElementById('agendaBenevolesList');
    if (!dl) return;
    const benevoles = Storage.getAdherents().filter(a => 
      a.type === 'Bénévole' || (a.type === 'Adhérent bénéficiaire' && a.aussiBenevole === true)
    );
    dl.innerHTML = benevoles.map(b => `<option value="${Utils.escapeHtml(b.prenom + ' ' + b.nom)}"></option>`).join('');
},

  // ---------- Vue HTML ----------
  getViewHTML() {
    return `
      <section class="view" id="view-agenda">
        <div class="view-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
          <div><h1>Agenda</h1><p>Interventions et événements planifiés</p></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-ghost" onclick="Agenda.exporterICS()">📅 Export ICS</button>
            <button class="btn btn-ghost" onclick="Agenda.requestNotificationPermission()">🔔 Activer notifications</button>
          </div>
        </div>

        <div class="card" style="padding:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <div style="display:flex;gap:6px;">
              <button class="btn btn-ghost" style="padding:8px 12px;" onclick="Agenda.prev()">◀</button>
              <button class="btn btn-ghost" style="padding:8px 12px;" onclick="Agenda.goToday()">Aujourd'hui</button>
              <button class="btn btn-ghost" style="padding:8px 12px;" onclick="Agenda.next()">▶</button>
            </div>
            <div style="display:flex;gap:4px;background:var(--bg-alt);padding:4px;border-radius:8px;">
              <button id="agendaBtnJour" class="btn" style="padding:6px 12px;font-size:.82rem;background:transparent;color:var(--text);" onclick="Agenda.setView('jour')">Jour</button>
              <button id="agendaBtnSemaine" class="btn" style="padding:6px 12px;font-size:.82rem;background:transparent;color:var(--text);" onclick="Agenda.setView('semaine')">Semaine</button>
              <button id="agendaBtnMois" class="btn" style="padding:6px 12px;font-size:.82rem;background:transparent;color:var(--text);" onclick="Agenda.setView('mois')">Mois</button>
            </div>
          </div>
          <h2 id="agendaTitre" style="font-size:1.1rem;font-weight:800;text-align:center;margin-bottom:12px;">—</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input type="text" id="agendaFilterBenevole" list="agendaBenevolesList" placeholder="🔍 Filtrer par bénévole" oninput="Agenda.setFilterBenevole(this.value)" style="padding:8px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;">
            <datalist id="agendaBenevolesList"></datalist>
            <select id="agendaFilterStatut" onchange="Agenda.setFilterStatut(this.value)" style="padding:8px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;">
              <option value="">Tous statuts</option>
              <option value="demande">Demandes</option>
              <option value="planifiee">Planifiées</option>
              <option value="en_cours">En cours</option>
              <option value="terminee">Terminées</option>
            </select>
          </div>
        </div>

        <div id="agendaContainer"></div>
      </section>`;
  },

  getModalsHTML() {
    return `
      <div class="modal" id="evtFormModal">
        <div class="modal-content" style="max-width:520px;">
          <div class="modal-header">
            <h2 id="evtFormTitle">Nouvel événement</h2>
            <button class="close-btn" onclick="Agenda.closeEvenementForm()">&times;</button>
          </div>
          <div class="modal-body">
            <form id="evenementForm" onsubmit="Agenda.saveEvenement(event)">
              <input type="hidden" id="evtEditId">
              <div class="form-group">
                <label>Titre *</label>
                <input type="text" id="evtTitre" placeholder="Ex : Réunion bureau, AG annuelle..." required>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="form-group">
                  <label>Type</label>
                  <select id="evtType">
                    <option value="Réunion">Réunion</option>
                    <option value="AG">Assemblée Générale</option>
                    <option value="Formation">Formation</option>
                    <option value="Sortie">Sortie</option>
                    <option value="Autre">Autre</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Couleur</label>
                  <input type="color" id="evtCouleur" value="#8b5cf6" style="height:42px;padding:4px;">
                </div>
              </div>
              <div class="form-group">
                <label>Date *</label>
                <input type="date" id="evtDate" required>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="form-group"><label>Heure début</label><input type="time" id="evtHeure"></div>
                <div class="form-group"><label>Heure fin</label><input type="time" id="evtHeureFin"></div>
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea id="evtDescription" rows="3"></textarea>
              </div>
              <div style="display:flex;gap:10px;margin-top:14px;">
                <button type="submit" class="btn" style="flex:1;">💾 Enregistrer</button>
                <button type="button" class="btn btn-ghost" id="evtDeleteBtn" style="display:none;background:var(--danger);color:#fff;" onclick="Agenda.removeEvenement(parseInt(document.getElementById('evtEditId').value))">🗑️ Supprimer</button>
                <button type="button" class="btn btn-ghost" onclick="Agenda.closeEvenementForm()">Annuler</button>
              </div>
            </form>
          </div>
        </div>
      </div>`;
  },

  onShow() {
    this.renderFiltres();
    this.render();
    // Afficher bouton supprimer si on édite
    const evtId = document.getElementById('evtEditId');
    const delBtn = document.getElementById('evtDeleteBtn');
    if (delBtn && evtId) {
      // Observateur simple
      const observer = new MutationObserver(() => {
        delBtn.style.display = evtId.value ? 'block' : 'none';
      });
      observer.observe(evtId, { attributes: true, attributeFilter: ['value'] });
    }
  }
};

Router.register({
  view: 'agenda',
  title: 'Agenda',
  icon: '📅',
  section: 'Activité',
  order: 3,
  getViewHTML: () => Agenda.getViewHTML(),
  getModalsHTML: () => Agenda.getModalsHTML(),
  onShow: () => Agenda.onShow()
});
</script>
<script>
// ============================================================
// MODULE : BÉNÉVOLES & FRAIS — Remboursement + compta
// ============================================================

const Frais = {

  BAREME_DEFAUT: 0.40,
  repartitionTemp: [],
  calculEnCours: false,

  getAll() { return Storage.getDeplacements(); },
  saveAll(list) { Storage.saveDeplacements(list); },

  getBareme() {
    const p = Storage.getParametres();
    return p.baremeKm || this.BAREME_DEFAUT;
  },

  nextNumero() {
    const n = this.getAll().length + 1;
    return 'DEP-' + String(n).padStart(3, '0');
  },

  getFiltered() {
    const q = (document.getElementById('fraisSearch').value || '').toLowerCase();
    const filtre = document.getElementById('fraisFilterStatut').value;
    return this.getAll().filter(f => {
      if (q) {
        const hay = [f.numero, f.benevole, f.motif, f.trajet].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (filtre === 'a_rembourser' && f.rembourse) return false;
      if (filtre === 'rembourse' && !f.rembourse) return false;
      return true;
    });
  },

  render() {
    const container = document.getElementById('fraisListContainer');
    if (!container) return;
    const all = this.getAll();
    const list = this.getFiltered();

    const aRembourser = all.filter(f => !f.rembourse).reduce((s, f) => s + (f.montant || 0), 0);
    const totalKm = all.reduce((s, f) => s + (f.km || 0), 0);
    const totalRembourse = all.filter(f => f.rembourse).reduce((s, f) => s + (f.montant || 0), 0);

    const elAR = document.getElementById('fraisStatARembourser');
    const elKm = document.getElementById('fraisStatKm');
    const elNb = document.getElementById('fraisStatNb');
    const elTot = document.getElementById('fraisStatTotal');
    if (elAR) elAR.textContent = aRembourser.toFixed(2) + ' €';
    if (elKm) elKm.textContent = totalKm.toFixed(0) + ' km';
    if (elNb) elNb.textContent = all.length;
    if (elTot) elTot.textContent = totalRembourse.toFixed(2) + ' €';

    const cnt = document.getElementById('fraisCount');
    if (cnt) cnt.textContent = `${list.length} déplacement${list.length > 1 ? 's' : ''} · Barème : ${this.getBareme().toFixed(2)} €/km`;

    if (list.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty-state">Aucun déplacement. Cliquez sur « ➕ Nouveau déplacement ».</div></div>';
      return;
    }
    list.sort((a, b) => new Date(b.date) - new Date(a.date));
    container.innerHTML = list.map(f => this.renderCard(f)).join('');
  },

  renderCard(f) {
    const statut = f.rembourse ? 'success' : 'warning';
    const badge = f.rembourse ? '<span class="badge badge-success">Remboursé</span>' : '<span class="badge badge-warning">À rembourser</span>';
    const nbInter = (f.interventions || []).length;
    const infoInter = nbInter > 0 ? ` · <strong>${nbInter} intervention${nbInter > 1 ? 's' : ''}</strong> (prorata)` : '';
    return `
      <div class="adh-card statut-${statut}" onclick="Frais.openDetail(${f.id})">
        <div class="adh-card-info">
          <div class="adh-card-name">
            <span class="adh-card-numero">${Utils.escapeHtml(f.numero)}</span>
            ${Utils.escapeHtml(f.benevole)} — ${f.km} km
          </div>
          <div class="adh-card-details">
            📅 ${Utils.formatDate(f.date)} · 🚗 ${Utils.escapeHtml(f.trajet || '—')}<br>
            💶 <strong>${(f.montant || 0).toFixed(2)} €</strong>${infoInter}<br>
            ${badge} ${f.motif ? '· ' + Utils.escapeHtml(f.motif) : ''}
            ${f.comptaPiece ? ' · 💰 ' + Utils.escapeHtml(f.comptaPiece) : ''}
          </div>
        </div>
        <div class="adh-card-actions">
          ${!f.rembourse ? `<button style="background:var(--success);color:#fff;border:none;border-radius:8px;padding:8px;cursor:pointer;min-width:36px;height:36px;" onclick="event.stopPropagation();Frais.openRembourseModal(${f.id})" title="Marquer remboursé">✅</button>` : ''}
          <button class="adh-btn-edit" onclick="event.stopPropagation();Frais.openForm(${f.id})" title="Modifier">✏️</button>
          <button class="adh-btn-del" onclick="event.stopPropagation();Frais.remove(${f.id})" title="Supprimer">🗑️</button>
        </div>
      </div>`;
  },

  openForm(id = null) {
    const form = document.getElementById('fraisForm');
    form.reset();
    document.getElementById('fraisEditId').value = '';
    this.repartitionTemp = [];
    this.refreshBenevolesFraisList();
    this.refreshInterventionsList();
    const baremeEl = document.getElementById('fraisBaremeAffiche');
    if (baremeEl) baremeEl.textContent = this.getBareme().toFixed(2);
    const statut = document.getElementById('fraisCalcStatut');
    if (statut) statut.innerHTML = '';

    if (id) {
      const f = this.getAll().find(x => x.id === id);
      if (!f) return;
      document.getElementById('fraisFormTitle').textContent = 'Modifier ' + f.numero;
      document.getElementById('fraisEditId').value = f.id;
      document.getElementById('fraisDate').value = f.date || '';
      document.getElementById('fraisBenevole').value = f.benevole || '';
      document.getElementById('fraisKm').value = f.km || '';
      document.getElementById('fraisTrajet').value = f.trajet || '';
      document.getElementById('fraisMotif').value = f.motif || '';
      document.getElementById('fraisNotes').value = f.notes || '';
      document.getElementById('fraisRembourse').checked = !!f.rembourse;
      if (Array.isArray(f.interventions) && f.interventions.length > 0 && typeof f.interventions[0] === 'object') {
        this.repartitionTemp = f.interventions.map(i => ({ ...i }));
      }
    } else {
      document.getElementById('fraisFormTitle').textContent = 'Nouveau déplacement';
      document.getElementById('fraisDate').value = Utils.todayISO();
    }
    this.renderRepartition();
    this.updateMontant();
    document.getElementById('fraisFormModal').classList.add('active');
  },

  closeForm() { document.getElementById('fraisFormModal').classList.remove('active'); },

  refreshBenevolesFraisList() {
    const dl = document.getElementById('benevolesFraisList');
    if (!dl) return;
    const list = Storage.getAdherents().filter(a => 
      a.type === 'Bénévole' || (a.type === 'Adhérent bénéficiaire' && a.aussiBenevole === true)
    );
    dl.innerHTML = list.map(b => `<option value="${Utils.escapeHtml(b.prenom + ' ' + b.nom)}"></option>`).join('');
  },

  refreshInterventionsList() {
    const sel = document.getElementById('fraisInterventions');
    if (!sel) return;
    if (typeof Interventions === 'undefined') return;
    const inter = Interventions.getAll().filter(i => i.statut === 'demande' || i.statut === 'terminee' || i.statut === 'en_cours' || i.statut === 'planifiee');
    sel.innerHTML = inter.map(i => `<option value="${Utils.escapeHtml(i.numero)}">${Utils.escapeHtml(i.numero)} · ${Utils.escapeHtml(i.demandeur)} · ${Utils.escapeHtml(i.type)}</option>`).join('');
  },

  syncRepartitionFromSelect() {
    const sel = document.getElementById('fraisInterventions');
    if (!sel) return;
    const selected = Array.from(sel.selectedOptions).map(o => o.value);
    const newRep = selected.map(num => {
      const existing = this.repartitionTemp.find(r => r.numero === num);
      return existing || { numero: num, kmIndividuel: 0, part: 0 };
    });
    this.repartitionTemp = newRep;
    this.renderRepartition();
    this.updateMontant();
  },

  renderRepartition() {
    const container = document.getElementById('fraisRepartitionContainer');
    if (!container) return;
    if (this.repartitionTemp.length === 0) {
      container.innerHTML = '<div style="padding:10px;color:var(--text-light);font-size:.85rem;text-align:center;border:1px dashed var(--border);border-radius:8px;">Sélectionnez au moins une intervention ci-dessus pour activer la répartition au prorata.</div>';
      return;
    }
    let html = '<div style="font-size:.8rem;color:var(--text-light);margin-bottom:8px;">Distance individuelle (si l\'intervention avait été seule).</div>';
    this.repartitionTemp.forEach((r, i) => {
      html += `
        <div style="display:grid;grid-template-columns:1fr 100px 90px;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg-alt);">
          <div style="font-size:.82rem;font-weight:600;">${Utils.escapeHtml(r.numero)}</div>
          <input type="number" step="1" min="0" placeholder="km seul" value="${r.kmIndividuel || ''}" oninput="Frais.setKmIndividuel(${i}, this.value)" style="padding:6px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;">
          <div id="fraisPart_${i}" style="text-align:right;font-weight:700;font-size:.88rem;color:var(--accent);">${(r.part || 0).toFixed(2)} €</div>
        </div>`;
    });
    container.innerHTML = html;
  },

  setKmIndividuel(i, val) {
    this.repartitionTemp[i].kmIndividuel = parseFloat(val) || 0;
    this.updateMontant();
  },

  updateMontant() {
    const kmTotal = parseFloat(document.getElementById('fraisKm').value) || 0;
    const bareme = this.getBareme();
    const coutReel = kmTotal * bareme;
    const totalKmInd = this.repartitionTemp.reduce((s, r) => s + (r.kmIndividuel || 0), 0);

    if (totalKmInd > 0) {
      this.repartitionTemp.forEach(r => {
        r.part = (r.kmIndividuel / totalKmInd) * coutReel;
      });
    } else {
      this.repartitionTemp.forEach(r => { r.part = 0; });
    }

    const el = document.getElementById('fraisMontant');
    if (el) el.value = coutReel.toFixed(2) + ' €';

    this.repartitionTemp.forEach((r, i) => {
      const partEl = document.getElementById('fraisPart_' + i);
      if (partEl) partEl.textContent = (r.part || 0).toFixed(2) + ' €';
    });

    const rec = document.getElementById('fraisRecapProrata');
    if (rec) {
      if (this.repartitionTemp.length === 0) {
        rec.style.display = 'none';
      } else if (totalKmInd === 0) {
        rec.style.display = 'block';
        rec.innerHTML = `<div style="font-size:.82rem;color:var(--warning);">💡 Saisissez les distances individuelles pour calculer la répartition.</div>`;
      } else {
        rec.style.display = 'block';
        const sommeParts = this.repartitionTemp.reduce((s, r) => s + r.part, 0);
        const economie = totalKmInd * bareme - coutReel;
        const pctEco = (totalKmInd * bareme) > 0 ? ((economie / (totalKmInd * bareme)) * 100).toFixed(0) : 0;
        rec.innerHTML = `
          <div style="background:#f0f9ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px;font-size:.82rem;">
            <div style="font-weight:700;margin-bottom:6px;color:#1e40af;">📊 Récapitulatif du prorata</div>
            <div>Coût réel de la tournée : <strong>${coutReel.toFixed(2)} €</strong> (${kmTotal} km × ${bareme.toFixed(2)} €)</div>
            <div>Total virtuel (si séparés) : <strong>${(totalKmInd * bareme).toFixed(2)} €</strong> (${totalKmInd} km)</div>
            <div style="margin-top:6px;padding-top:6px;border-top:1px solid #bfdbfe;">
              Économie totale : <strong style="color:var(--success);">${economie.toFixed(2)} €</strong> (${pctEco} %)
            </div>
            <div style="margin-top:6px;font-size:.78rem;color:var(--text-light);">
              Vérification : somme des parts = ${sommeParts.toFixed(2)} € ✓
            </div>
          </div>`;
      }
    }
  },

  async geocode(adresse) {
    if (!adresse) return null;
    try {
      const urlFR = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(adresse)}&limit=1`;
      const resFR = await fetch(urlFR);
      if (resFR.ok) {
        const dataFR = await resFR.json();
        if (dataFR.features && dataFR.features.length > 0) {
          const coords = dataFR.features[0].geometry.coordinates;
          console.log('✅ BAN géocodé :', adresse, '→', coords);
          return [coords[0], coords[1]];
        }
      }
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(adresse)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data.length > 0) {
          console.log('✅ Nominatim géocodé :', adresse);
          return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
        }
      }
      console.warn('❌ Adresse introuvable :', adresse);
      return null;
    } catch (e) {
      console.error('Geocode error:', adresse, e);
      return null;
    }
  },

  async route(points) {
    if (points.length < 2) return 0;
    try {
      const coords = points.map(p => `${p[0]},${p[1]}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.routes && data.routes[0]) {
        return data.routes[0].distance / 1000;
      }
      return 0;
    } catch (e) {
      console.error('Route error:', e);
      return 0;
    }
  },

  async calculerDistances() {
    if (this.calculEnCours) return;
    const statut = document.getElementById('fraisCalcStatut');
    const setStatut = (msg, color = 'var(--text-light)') => {
      if (statut) statut.innerHTML = `<span style="color:${color};">${msg}</span>`;
    };

    const benevoleNom = document.getElementById('fraisBenevole').value.trim();
    if (!benevoleNom) { alert('Sélectionnez d\'abord un bénévole.'); return; }
    const benevole = Storage.getAdherents().find(a => 
      a.type === 'Bénévole' && 
      `${a.prenom} ${a.nom}`.toLowerCase() === benevoleNom.toLowerCase()
    );
    if (!benevole) { alert('Bénévole introuvable dans l\'annuaire.'); return; }

    const adresseDepart = benevole.adresseDepart || 
      [benevole.adresse, benevole.cp, benevole.ville, benevole.pays].filter(Boolean).join(', ');
    if (!adresseDepart) { alert('Le bénévole n\'a pas d\'adresse renseignée.'); return; }

    if (this.repartitionTemp.length === 0) {
      alert('Sélectionnez au moins une intervention.');
      return;
    }

    this.calculEnCours = true;
    setStatut('⏳ Géocodage de l\'adresse de départ...', 'var(--accent)');

    const coordsDepart = await this.geocode(adresseDepart);
    if (!coordsDepart) {
      setStatut('❌ Impossible de géocoder l\'adresse de départ : ' + adresseDepart, 'var(--danger)');
      this.calculEnCours = false;
      return;
    }

    const arrets = [];
    const problemes = [];

    for (let i = 0; i < this.repartitionTemp.length; i++) {
      const r = this.repartitionTemp[i];
      setStatut(`⏳ Géocodage ${i + 1}/${this.repartitionTemp.length} : ${r.numero}...`, 'var(--accent)');

      const inter = (typeof Interventions !== 'undefined')
        ? Interventions.getAll().find(x => x.numero === r.numero)
        : null;
      if (!inter) {
        arrets.push(null);
        problemes.push(`${r.numero} : intervention introuvable`);
        continue;
      }

      let adresseArret = null;
      let adh = null;

      if (inter.adherentId) {
        adh = Storage.getAdherents().find(a => a.id === inter.adherentId);
      }

      if (!adh && inter.demandeur) {
        const nomCherche = inter.demandeur.toLowerCase().trim();
        adh = Storage.getAdherents().find(a => {
          const nomComplet = `${a.prenom || ''} ${a.nom || ''}`.toLowerCase().trim();
          const nomInverse = `${a.nom || ''} ${a.prenom || ''}`.toLowerCase().trim();
          return nomComplet === nomCherche || nomInverse === nomCherche;
        });
        if (!adh) {
          const mots = nomCherche.split(/\s+/).filter(m => m.length > 1);
          if (mots.length >= 2) {
            adh = Storage.getAdherents().find(a => {
              const prenom = (a.prenom || '').toLowerCase();
              const nom = (a.nom || '').toLowerCase();
              return mots.every(m => prenom.includes(m) || nom.includes(m));
            });
          }
        }
      }

      if (adh) {
        adresseArret = [adh.adresse, adh.cp, adh.ville].filter(Boolean).join(', ');
      }

      if (!adresseArret && inter.description) {
        const match = inter.description.match(/Adresse\s*:\s*([^\n]+)/i);
        if (match && match[1]) adresseArret = match[1].trim();
      }

      if (!adresseArret) {
        arrets.push(null);
        problemes.push(`${r.numero} : adresse introuvable pour "${inter.demandeur}"`);
        continue;
      }

      await new Promise(resolve => setTimeout(resolve, 300));
      const coords = await this.geocode(adresseArret);
      arrets.push(coords);
      if (!coords) problemes.push(`${r.numero} : géocodage échoué (${adresseArret})`);
    }

    const pointsTournee = [coordsDepart, ...arrets.filter(Boolean), coordsDepart];
    setStatut('🚗 Calcul de l\'itinéraire complet...', 'var(--accent)');
    const kmTotal = Math.round(await this.route(pointsTournee));

    for (let i = 0; i < arrets.length; i++) {
      if (!arrets[i]) { this.repartitionTemp[i].kmIndividuel = 0; continue; }
      setStatut(`🚗 Trajet individuel ${i + 1}/${arrets.length}...`, 'var(--accent)');
      await new Promise(resolve => setTimeout(resolve, 200));
      const kmInd = await this.route([coordsDepart, arrets[i], coordsDepart]);
      this.repartitionTemp[i].kmIndividuel = Math.round(kmInd);
    }

    document.getElementById('fraisKm').value = kmTotal;
    if (!document.getElementById('fraisTrajet').value) {
      document.getElementById('fraisTrajet').value = 'Départ → ' + this.repartitionTemp.map(r => r.numero).join(' → ') + ' → Retour';
    }
    this.renderRepartition();
    this.updateMontant();

    const nbManquants = arrets.filter(a => a === null).length;
    setStatut(
      `✅ Calcul terminé : ${kmTotal} km (${this.repartitionTemp.length} interventions)` +
      (nbManquants > 0 ? ` — ⚠️ ${nbManquants} adresse(s) introuvable(s)` : ''),
      nbManquants > 0 ? 'var(--warning)' : 'var(--success)'
    );

    if (problemes.length > 0) {
      setTimeout(() => {
        alert('⚠️ Problèmes détectés :\n\n' + problemes.join('\n'));
      }, 500);
    }

    this.calculEnCours = false;
  },

  save(event) {
    event.preventDefault();
    const id = document.getElementById('fraisEditId').value;
    const km = parseFloat(document.getElementById('fraisKm').value) || 0;
    const bareme = this.getBareme();
    const coutReel = km * bareme;

    const data = {
      date: document.getElementById('fraisDate').value,
      benevole: document.getElementById('fraisBenevole').value.trim(),
      km,
      trajet: document.getElementById('fraisTrajet').value.trim(),
      motif: document.getElementById('fraisMotif').value.trim(),
      notes: document.getElementById('fraisNotes').value.trim(),
      rembourse: document.getElementById('fraisRembourse').checked,
      montant: coutReel,
      bareme,
      interventions: this.repartitionTemp.map(r => ({
        numero: r.numero,
        kmIndividuel: r.kmIndividuel || 0,
        part: r.part || 0
      }))
    };
    if (!data.benevole || km <= 0) { alert('Bénévole et kilométrage obligatoires.'); return; }

    const list = this.getAll();
    if (id) {
      const idx = list.findIndex(f => String(f.id) === String(id));
      if (idx !== -1) list[idx] = { ...list[idx], ...data };
    } else {
      list.push({ id: Date.now(), numero: this.nextNumero(), ...data });
    }
    this.saveAll(list);
    this.closeForm();
    this.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    BricoBol.updateStorageInfo();
  },

  remove(id) {
    const f = this.getAll().find(x => x.id === id);
    if (!f) return;
    if (!confirm(`Supprimer le déplacement ${f.numero} ?`)) return;
    this.saveAll(this.getAll().filter(x => x.id !== id));
    this.render();
    this.closeDetail();
    BricoBol.updateStorageInfo();
  },

  // ============================================================
  // REMBOURSEMENT
  // ============================================================

  openRembourseModal(id) {
    const f = this.getAll().find(x => x.id === id);
    if (!f) return;

    if (f.rembourse) {
      alert(`ℹ️ Ce déplacement est déjà remboursé${f.dateRemboursement ? ' le ' + Utils.formatDate(f.dateRemboursement) : ''}.\n\nPour modifier, supprimez l'écriture comptable associée et annulez le remboursement manuellement.`);
      return;
    }

    document.getElementById('fraisRembId').value = id;
    document.getElementById('fraisRembBenevole').textContent = f.benevole;
    document.getElementById('fraisRembMontant').textContent = (f.montant || 0).toFixed(2) + ' €';
    document.getElementById('fraisRembDate').value = Utils.todayISO();
    document.getElementById('fraisRembMode').value = 'Espèces';
    document.getElementById('fraisRembNotes').value = '';

    document.getElementById('fraisRembourseModal').classList.add('active');
  },

  closeRembourseModal() {
    document.getElementById('fraisRembourseModal').classList.remove('active');
  },

  confirmerRembourse(event) {
    event.preventDefault();
    const id = parseInt(document.getElementById('fraisRembId').value);
    const f = this.getAll().find(x => x.id === id);
    if (!f) { alert('Déplacement introuvable.'); return; }
    if (f.rembourse) { alert('Ce déplacement est déjà remboursé.'); this.closeRembourseModal(); return; }

    const dateRemb = document.getElementById('fraisRembDate').value;
    const mode = document.getElementById('fraisRembMode').value;
    const note = document.getElementById('fraisRembNotes').value.trim();
    const montant = f.montant || 0;

    if (montant <= 0) { alert('Le montant du déplacement est nul, impossible de rembourser.'); return; }

    // 1) Créer l'écriture compta (dépense)
    const comptaList = (typeof Compta !== 'undefined') ? Compta.getAll() : Storage.getEntries();
    const comptaId = Date.now() + Math.random();
    const pieceCount = comptaList.filter(e => e.type === 'depense').length + 1;
    const piece = 'DEP-' + String(pieceCount).padStart(3, '0');

    const entry = {
      id: comptaId,
      type: 'depense',
      date: dateRemb,
      piece,
      yapla: '-',
      tiers: f.benevole,
      intervention: 'Aucune / Autre',
      paiement: mode,
      items: [{ name: '🚗 Remboursement frais de route', amount: montant, category: 'variable' }],
      total: montant,
      source: 'frais-remboursement',
      notes: note || ''
    };
    comptaList.push(entry);
    if (typeof Compta !== 'undefined') Compta.saveAll(comptaList);
    else Storage.saveEntries(comptaList);

    // 2) Marquer le déplacement comme remboursé
    const list = this.getAll();
    const idx = list.findIndex(x => x.id === id);
    if (idx !== -1) {
      list[idx].rembourse = true;
      list[idx].dateRemboursement = dateRemb;
      list[idx].modeRemboursement = mode;
      list[idx].noteRemboursement = note;
      list[idx].comptaId = comptaId;
      list[idx].comptaPiece = piece;
      this.saveAll(list);
    }

    // 3) Rafraîchir
    if (typeof Compta !== 'undefined') Compta.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    this.render();
    this.closeRembourseModal();
    this.closeDetail();
    BricoBol.updateStorageInfo();

    alert(`✅ Remboursement enregistré.\n\n💶 ${montant.toFixed(2)} € — ${mode}\n💰 Écriture compta : ${piece}`);
  },

  openDetail(id) {
    const f = this.getAll().find(x => x.id === id);
    if (!f) return;
    const statut = f.rembourse ? '<span class="badge badge-success">Remboursé</span>' : '<span class="badge badge-warning">À rembourser</span>';

    let repartitionHTML = '';
    const inter = f.interventions || [];
    if (inter.length > 0 && typeof inter[0] === 'object' && inter[0].part !== undefined) {
      const totalKmInd = inter.reduce((s, r) => s + (r.kmIndividuel || 0), 0);
      const totalVirtuel = totalKmInd * (f.bareme || 0.40);
      const economie = totalVirtuel - (f.montant || 0);
      repartitionHTML = `
        <div class="adh-detail-section">
          <h4>Répartition au prorata (${inter.length} intervention${inter.length > 1 ? 's' : ''})</h4>
          <table style="width:100%;font-size:.85rem;border-collapse:collapse;margin-top:6px;">
            <thead>
              <tr style="border-bottom:1px solid var(--border);">
                <th style="text-align:left;padding:6px 4px;">Intervention</th>
                <th style="text-align:right;padding:6px 4px;">Km seul</th>
                <th style="text-align:right;padding:6px 4px;">Part</th>
              </tr>
            </thead>
            <tbody>
              ${inter.map(r => `
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:6px 4px;font-weight:600;">${Utils.escapeHtml(r.numero)}</td>
                  <td style="text-align:right;padding:6px 4px;">${r.kmIndividuel || 0} km</td>
                  <td style="text-align:right;padding:6px 4px;color:var(--accent);font-weight:700;">${(r.part || 0).toFixed(2)} €</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr style="border-top:2px solid var(--border);font-weight:700;">
                <td style="padding:6px 4px;">TOTAL</td>
                <td style="text-align:right;padding:6px 4px;">${totalKmInd} km</td>
                <td style="text-align:right;padding:6px 4px;color:var(--success);">${(f.montant || 0).toFixed(2)} €</td>
              </tr>
            </tfoot>
          </table>
          <div style="margin-top:10px;font-size:.8rem;color:var(--text-light);">
            💡 Sans tournée groupée, coût virtuel = <strong>${totalVirtuel.toFixed(2)} €</strong><br>
            💰 Économie réalisée = <strong style="color:var(--success);">${economie.toFixed(2)} €</strong>
          </div>
        </div>`;
    } else if (inter.length > 0) {
      repartitionHTML = `<div class="adh-detail-section"><h4>Interventions liées</h4>${inter.map(n => `<p>🛠️ ${Utils.escapeHtml(typeof n === 'string' ? n : n.numero)}</p>`).join('')}</div>`;
    }

    let rembHTML = '';
    if (f.rembourse) {
      rembHTML = `
        <div class="adh-detail-section" style="background:#f0fdf4;border:1px solid #86efac;">
          <h4 style="color:#166534;">✅ Remboursement</h4>
          <p style="font-size:.88rem;">📅 Le <strong>${Utils.formatDate(f.dateRemboursement)}</strong></p>
          ${f.modeRemboursement ? `<p style="font-size:.88rem;">💳 Mode : ${Utils.escapeHtml(f.modeRemboursement)}</p>` : ''}
          ${f.comptaPiece ? `<p style="font-size:.88rem;">💰 Écriture compta : <strong>${Utils.escapeHtml(f.comptaPiece)}</strong></p>` : ''}
          ${f.noteRemboursement ? `<p style="font-size:.88rem;">📝 ${Utils.escapeHtml(f.noteRemboursement)}</p>` : ''}
        </div>`;
    }

    document.getElementById('fraisDetailBody').innerHTML = `
      <div style="padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:1.25rem;font-weight:800;">${Utils.escapeHtml(f.numero)}</div>
          ${statut}
        </div>
        <div style="color:var(--text-light);font-size:.85rem;margin-top:4px;">${Utils.formatDate(f.date)}</div>
      </div>
      <div class="adh-detail-section">
        <h4>Bénévole</h4>
        <p>👤 ${Utils.escapeHtml(f.benevole)}</p>
      </div>
      <div class="adh-detail-section">
        <h4>Trajet global</h4>
        <p>🚗 ${Utils.escapeHtml(f.trajet || '—')}</p>
        <p>📍 ${f.km} km × ${(f.bareme || 0.40).toFixed(2)} € = <strong>${(f.montant || 0).toFixed(2)} €</strong></p>
      </div>
      ${f.motif ? `<div class="adh-detail-section"><h4>Motif</h4><p>${Utils.escapeHtml(f.motif)}</p></div>` : ''}
      ${repartitionHTML}
      ${rembHTML}
      ${f.notes ? `<div class="adh-detail-section"><h4>Notes</h4><p>${Utils.escapeHtml(f.notes)}</p></div>` : ''}
      <div class="adh-detail-actions">
        ${!f.rembourse ? `<button class="btn btn-success" onclick="Frais.closeDetail();Frais.openRembourseModal(${f.id});">✅ Marquer remboursé</button>` : ''}
        <button class="btn btn-secondary" onclick="Frais.closeDetail();Frais.openForm(${f.id});">✏️ Modifier</button>
        <button class="btn btn-danger" onclick="Frais.remove(${f.id})">🗑️ Supprimer</button>
      </div>`;
    document.getElementById('fraisDetailModal').classList.add('active');
  },

  openARembourserModal() {
    this._openFraisModal('a_rembourser', '💶 À rembourser', '#8b5cf6', '#faf5ff', '#c4b5fd');
  },

  openRemboursesModal() {
    this._openFraisModal('rembourse', '✅ Déjà remboursés', '#16a34a', '#f0fdf4', '#86efac');
  },

  openKmModal() {
    this._openFraisModal('all', '🚗 Kilométrage total', '#0ea5e9', '#f0f9ff', '#bfdbfe');
  },

  openDeplacementsModal() {
    this._openFraisModal('all', '📦 Tous les déplacements', '#f97316', '#fff7ed', '#fdba74');
  },

  _openFraisModal(filtre, titre, color, bg, border) {
    let list = this.getAll();
    if (filtre === 'a_rembourser') list = list.filter(f => !f.rembourse);
    else if (filtre === 'rembourse') list = list.filter(f => f.rembourse);
    list.sort((a, b) => new Date(b.date) - new Date(a.date));

    const totalMontant = list.reduce((s, f) => s + (f.montant || 0), 0);
    const totalKm = list.reduce((s, f) => s + (f.km || 0), 0);

    document.getElementById('fraisModalTitle').textContent = titre;
    document.getElementById('fraisModalBody').innerHTML = `
      <div style="background:${bg};border:1px solid ${border};border-radius:10px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;">

          <div style="font-size:.72rem;color:${color};text-transform:uppercase;font-weight:700;">Montant</div>

      </div>

        ? '<div class="empty-state">Aucun déplacement.</div>'
        : `<div style="max-height:420px;overflow-y:auto;">
            ${list.map(f => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--border);border-left:4px solid ${f.rembourse ? '#16a34a' : '#f59e0b'};border-radius:8px;margin-bottom:6px;cursor:pointer;"
                   onclick="Frais.closeFraisModal();Frais.openDetail(${f.id});">
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-size:.88rem;">
                    <span style="color:var(--accent);font-size:.72rem;">${Utils.escapeHtml(f.numero)}</span>
                    ${Utils.escapeHtml(f.benevole)}

                  <div style="font-size:.76rem;color:var(--text-light);margin-top:2px;">
                    📅 ${Utils.formatDate(f.date)} · 🚗 ${f.km} km<br>
                    ${Utils.escapeHtml(f.trajet || '—')}

                  <div style="font-size:.68rem;color:${f.rembourse ? 'var(--success)' : 'var(--warning)'};font-weight:700;">
                    ${f.rembourse ? '✓ Remboursé' : '⏳ À rembourser'}
                  </div>
                </div>

          </div>`}
    `;
    document.getElementById('fraisModal').classList.add('active');
  },

  closeFraisModal() {
    document.getElementById('fraisModal').classList.remove('active');

  closeDetail() { document.getElementById('fraisDetailModal').classList.remove('active'); },

  exportCSV() {
    const list = this.getAll();
    if (list.length === 0) { alert('Aucun déplacement.'); return; }
    const headers = ['Numéro','Date','Bénévole','Trajet','Motif','Km total','Barème','Coût réel','Remboursé','Date remboursement','Mode','Compta','Répartition'];
    let csv = headers.join(';') + '\n';
    list.forEach(f => {
      const rep = (f.interventions || []).map(r => typeof r === 'string' ? r : `${r.numero} (${r.kmIndividuel}km→${(r.part||0).toFixed(2)}€)`).join(' | ');
      const row = [
        f.numero, f.date, f.benevole, f.trajet, f.motif, f.km, f.bareme, (f.montant || 0).toFixed(2),
        f.rembourse ? 'Oui' : 'Non', f.dateRemboursement || '', f.modeRemboursement || '', f.comptaPiece || '', rep
      ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(';');
      csv += row + '\n';
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'frais_bricobol.csv';
    link.click();
    URL.revokeObjectURL(link.href);
  },

</script>
<script>
// ============================================================
// MODULE : COTISATIONS — modales cliquables + verrouillage
// ============================================================

const Cotisations = {

  getAll() { return Storage.get('cotisations', []); },
  saveAll(list) { return Storage.set('cotisations', list); },

  getMontant() {
    const p = Storage.getParametres();
    return p.cotisationAnnuelle || 10;
  },

  getByAdherent(adherentId) {
    return this.getAll()
      .filter(c => c.adherentId === adherentId)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  isPaidForYear(adherentId, year) {
    const y = year || new Date().getFullYear();
    return this.getAll().some(c => 
      c.adherentId === adherentId && 
      c.exercice === y && 
      c.statut !== 'en_attente'
    );
  },

  getEnAttente() {
    return this.getAll().filter(c => c.statut === 'en_attente');
  },

  getValidees() {
    return this.getAll().filter(c => c.statut !== 'en_attente');
  },

  countEnAttente() {
    return this.getEnAttente().length;
  },

  creerEnAttente(adherentId, adherentNom, options = {}) {
    const list = this.getAll();
    const cotis = {
      id: Date.now() + Math.random(),
      adherentId,
      adherentNom,
      date: options.date || Utils.todayISO(),
      montant: options.montant || 0,
      mode: options.mode || 'à définir',
      exercice: options.exercice || new Date().getFullYear(),
      statut: 'en_attente',
      source: options.source || 'manuelle',
      note: options.note || '',
      comptaId: null,
      comptaPiece: null,
      dateCreation: new Date().toISOString(),
      verrouille: options.source !== 'import-yapla'
    };
    list.push(cotis);
    this.saveAll(list);
    return cotis;
  },

  valider(id, options = {}) {
    const list = this.getAll();
    const idx = list.findIndex(c => c.id === id);
    if (idx === -1) return false;
    const c = list[idx];
    if (c.statut !== 'en_attente') return false;

    const montant = options.montant !== undefined ? options.montant : c.montant;
    const mode = options.mode || c.mode || 'Espèces';
    const dateValidation = options.date || Utils.todayISO();
    const note = options.note !== undefined ? options.note : c.note;

    const comptaList = (typeof Compta !== 'undefined') ? Compta.getAll() : Storage.getEntries();
    const comptaId = Date.now() + Math.random();
    const pieceCount = comptaList.filter(e => e.type === 'recette').length + 1;
    const piece = 'REC-' + String(pieceCount).padStart(3, '0');

    const entry = {
      id: comptaId,
      type: 'recette',
      date: dateValidation,
      piece,
      yapla: '-',
      tiers: c.adherentNom,
      intervention: 'Aucune / Autre',
      paiement: mode,
      items: [{ name: `🎫 Adhésion (${montant.toFixed(2)} € / an)`, amount: montant, category: '' }],
      total: montant,
      source: 'cotisation'
    };
    comptaList.push(entry);
    if (typeof Compta !== 'undefined') Compta.saveAll(comptaList);
    else Storage.saveEntries(comptaList);

    list[idx] = {
      ...c,
      montant,
      mode,
      date: dateValidation,
      note,
      statut: 'validee',
      comptaId,
      comptaPiece: piece,
      dateValidation: new Date().toISOString(),
      verrouille: true
    };
    this.saveAll(list);

    const adhList = Storage.getAdherents();
    const adhIdx = adhList.findIndex(a => a.id === c.adherentId);
    if (adhIdx !== -1) {
      const baseDate = adhList[adhIdx].dateExpiration || dateValidation;
      adhList[adhIdx].dateExpiration = Utils.addOneYear(baseDate);
      adhList[adhIdx].dateCreation = adhList[adhIdx].dateCreation || dateValidation;
      Storage.saveAdherents(adhList);
    }

    if (typeof Compta !== 'undefined') Compta.render();
    if (typeof Adherents !== 'undefined') Adherents.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    this.render();
    BricoBol.updateStorageInfo();

    return true;
  },

  annuler(id) {
    const c = this.getAll().find(x => x.id === id);
    if (!c) return;
    if (c.statut !== 'en_attente') { alert('Seules les cotisations en attente peuvent être annulées.'); return; }
    if (!confirm(`Annuler la cotisation en attente de ${c.adherentNom} ?\n\nElle sera supprimée définitivement.`)) return;
    this.saveAll(this.getAll().filter(x => x.id !== id));
    this.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    BricoBol.updateStorageInfo();
  },

  enregistrer(adherentId, options = {}) {
    const adh = Storage.getAdherents().find(a => a.id === adherentId);
    if (!adh) { alert('Adhérent introuvable'); return; }

    const exercice = options.exercice || new Date().getFullYear();
    if (this.isPaidForYear(adherentId, exercice)) {
      if (!confirm(`${adh.prenom} ${adh.nom} a déjà payé pour ${exercice}.\n\nEnregistrer quand même ?`)) return;
    }

    const montant = options.montant || this.getMontant();
    const date = options.date || Utils.todayISO();
    const mode = options.mode || 'Espèces';
    const notes = options.notes || '';

    const cotis = this._creer(adherentId, `${adh.prenom} ${adh.nom}`, {
      date, montant, mode, exercice, notes,
      statut: 'validee',
      source: 'manuelle'
    });

    const adhList = Storage.getAdherents();
    const idx = adhList.findIndex(a => a.id === adherentId);
    if (idx !== -1) {
      const baseDate = adhList[idx].dateExpiration || date;
      adhList[idx].dateExpiration = Utils.addOneYear(baseDate);
      adhList[idx].dateCreation = adhList[idx].dateCreation || date;
      Storage.saveAdherents(adhList);
    }

    if (typeof Compta !== 'undefined') Compta.render();
    if (typeof Adherents !== 'undefined') Adherents.render();
    this.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    BricoBol.updateStorageInfo();

    return cotis;
  },

  _creer(adherentId, adherentNom, data) {
    const comptaList = (typeof Compta !== 'undefined') ? Compta.getAll() : Storage.getEntries();
    const comptaId = Date.now() + Math.random();
    const pieceCount = comptaList.filter(e => e.type === 'recette').length + 1;
    const piece = data.numPiece || ('REC-' + String(pieceCount).padStart(3, '0'));

    const entry = {
      id: comptaId,
      type: 'recette',
      date: data.date,
      piece,
      yapla: data.yaplaId || '-',
      tiers: adherentNom,
      intervention: 'Aucune / Autre',
      paiement: data.mode,
      items: [{ name: `🎫 Adhésion (${data.montant} € / an)`, amount: data.montant, category: '' }],
      total: data.montant,
      source: 'cotisation'
    };
    comptaList.push(entry);
    if (typeof Compta !== 'undefined') Compta.saveAll(comptaList);
    else Storage.saveEntries(comptaList);

    const cotisList = this.getAll();
    const cotis = {
      id: Date.now() + Math.random(),
      adherentId,
      adherentNom,
      date: data.date,
      montant: data.montant,
      mode: data.mode,
      exercice: data.exercice,
      statut: 'validee',
      comptaId,
      comptaPiece: piece,
      notes: data.notes || '',
      source: data.source || 'manuelle',
      yaplaAdhesionNumero: data.yaplaAdhesionNumero || null,
      dateEnregistrement: new Date().toISOString(),
      verrouille: data.source !== 'import-yapla'
    };
    cotisList.push(cotis);
    this.saveAll(cotisList);

    return cotis;
  },

  creerPourImport(adherentId, adherentNom, data) {
    if (data.yaplaAdhesionNumero) {
      const exist = this.getAll().find(c => c.yaplaAdhesionNumero === data.yaplaAdhesionNumero);
      if (exist) return null;
    }
    if (this.isPaidForYear(adherentId, data.exercice)) return null;

    return this._creer(adherentId, adherentNom, {
      ...data,
      statut: 'validee',
      source: 'import-yapla'
    });
  },

  // ✅ Met à jour une cotisation existante issue d'un import (montant, mode)
  majImport(id, data) {
    const list = this.getAll();
    const idx = list.findIndex(c => c.id === id);
    if (idx === -1) return false;
    const c = list[idx];

    // Si verrouillée par l'utilisateur → on ne touche pas
    if (c.verrouille) return false;

    list[idx] = {
      ...c,
      montant: data.montant !== undefined ? data.montant : c.montant,
      mode: data.mode !== undefined ? data.mode : c.mode,
      date: data.date !== undefined ? data.date : c.date,
      note: data.note !== undefined ? data.note : c.note,
      yaplaAdhesionNumero: data.yaplaAdhesionNumero || c.yaplaAdhesionNumero,
      source: 'import-yapla',
      dateMajImport: new Date().toISOString()
    };
    this.saveAll(list);
    return true;
  },

  remove(id) {
    const c = this.getAll().find(x => x.id === id);
    if (!c) return;
    if (c.statut === 'en_attente') {
      this.annuler(id);
      return;
    }
    if (!confirm(`Supprimer la cotisation de ${c.adherentNom} (${c.exercice}) ?\n\nLa recette comptable associée sera aussi supprimée.`)) return;

    if (c.comptaId && typeof Compta !== 'undefined') {
      const comptaList = Compta.getAll().filter(e => e.id !== c.comptaId);
      Compta.saveAll(comptaList);
      Compta.render();
    }

    this.saveAll(this.getAll().filter(x => x.id !== id));
    this.render();
    if (typeof Adherents !== 'undefined') Adherents.render();
    if (typeof Dashboard !== 'undefined' && Dashboard.render) Dashboard.render();
    BricoBol.updateStorageInfo();
  },
