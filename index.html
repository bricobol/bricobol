<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion BricoBol</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#0f172a;--primary-light:#334155;--accent:#2563eb;--accent-hover:#1d4ed8;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#0ea5e9;--purple:#8b5cf6;--orange:#f97316;--bg:#f1f5f9;--bg-alt:#f8fafc;--card-bg:#fff;--text:#0f172a;--text-light:#64748b;--text-muted:#94a3b8;--border:#e2e8f0;--border-strong:#cbd5e1;--radius:14px;--radius-sm:10px;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 4px 16px rgba(15,23,42,.08);--shadow-lg:0 12px 32px rgba(15,23,42,.12);--transition:all .22s cubic-bezier(.4,0,.2,1);--sidebar-width:260px;--header-height:64px}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;height:100vh;height:100dvh;width:100%}
.sidebar{width:var(--sidebar-width);background:var(--primary);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:var(--transition);z-index:100}
.sidebar-logo{padding:24px 22px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent) 0%,var(--info) 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.sidebar-logo-text strong{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;display:block}
.sidebar-logo-text small{font-size:.72rem;color:var(--text-muted)}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-section{margin-bottom:20px}
.nav-section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:0 10px 8px 10px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);color:#cbd5e1;text-decoration:none;font-size:.92rem;font-weight:500;cursor:pointer;transition:var(--transition);margin-bottom:2px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(37,99,235,.18);color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item-icon{font-size:1.15rem;width:24px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:.75rem;color:var(--text-muted);display:flex;justify-content:space-between}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--header-height);background:var(--card-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:50}
.burger-btn{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text);padding:6px 10px;border-radius:var(--radius-sm)}
.topbar-title{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;flex:1}
.content{flex:1;overflow-y:auto;padding:24px;padding-bottom:100px}
.view{display:none;max-width:1200px;margin:0 auto;animation:fadeIn .28s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.view-header{margin-bottom:24px}
.view-header h1{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.view-header p{color:var(--text-light);font-size:.92rem}
.card{background:var(--card-bg);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:18px}
.card-placeholder{text-align:center;padding:60px 24px;color:var(--text-light)}
.card-placeholder-icon{font-size:3rem;margin-bottom:16px;opacity:.5}
.card-placeholder h3{font-size:1.1rem;color:var(--text);margin-bottom:8px;font-weight:700}
.card-placeholder p{font-size:.9rem;max-width:400px;margin:0 auto;line-height:1.6}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:var(--transition)}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.stat-card.success::before{background:var(--success)}
.stat-card.warning::before{background:var(--warning)}
.stat-card.orange::before{background:var(--orange)}
.stat-card.purple::before{background:var(--purple)}
.stat-label{font-size:.78rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
.stat-value{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
.stat-sub{font-size:.8rem;color:var(--text-light);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.28)}
.btn-secondary{background:var(--primary)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--border-strong)}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:90}
.overlay.active{display:block}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;padding:12px}
.modal.active{display:flex}
.modal-content{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-header h2{font-size:1.05rem;font-weight:700}
.close-btn{background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;opacity:.8;line-height:1}
.close-btn:hover{opacity:1}
.modal-body{padding:20px;overflow-y:auto;flex-grow:1}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;font-size:.82rem;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.92rem;background:#fff;color:var(--text);font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-neutral{background:#e2e8f0;color:#334155}
.adh-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;transition:var(--transition);border-left:4px solid var(--accent)}
.adh-card:hover{box-shadow:var(--shadow-md)}
.adh-card.statut-actif{border-left-color:var(--success)}
.adh-card.statut-bientot{border-left-color:var(--warning);background:#fffbeb}
.adh-card.statut-expire{border-left-color:var(--danger);background:#fef2f2}
.adh-card-info{flex:1;min-width:180px}
.adh-card-name{font-weight:700;font-size:.98rem;margin-bottom:4px}
.adh-card-numero{font-size:.72rem;font-weight:700;color:var(--accent);margin-right:6px}
.adh-card-details{font-size:.8rem;color:var(--text-light);line-height:1.5}
.adh-card-actions{display:flex;gap:6px;flex-wrap:wrap}
.adh-card-actions a,.adh-card-actions button{border:none;border-radius:8px;padding:8px;cursor:pointer;font-size:.95rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;transition:var(--transition);color:#fff}
.adh-btn-call{background:var(--info)}
.adh-btn-sms{background:var(--purple)}
.adh-btn-msg{background:var(--info)}
.adh-btn-gps{background:var(--orange)}
.adh-btn-edit{background:var(--accent)}
.adh-btn-del{background:var(--danger)}
.adh-card-actions a:hover,.adh-card-actions button:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.adh-detail-header{display:flex;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.adh-detail-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--info));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;font-weight:800;flex-shrink:0}
.adh-detail-name{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.adh-detail-type{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);background:#dbeafe;padding:3px 10px;border-radius:12px}
.adh-detail-section{background:var(--bg-alt);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.adh-detail-section h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-light);margin-bottom:8px;font-weight:700}
.adh-detail-section p{font-size:.9rem;margin-bottom:4px}
.adh-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.gps-popup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;display:none;z-index:1100;width:90%;max-width:340px}
.gps-popup.active{display:block}
.gps-popup h3{margin-bottom:12px;font-size:.95rem;font-weight:700}
.gps-popup a{display:block;padding:11px 14px;border-radius:var(--radius-sm);text-decoration:none;color:var(--text);font-weight:600;margin-bottom:6px;background:var(--bg-alt);transition:var(--transition);font-size:.9rem}
.gps-popup a:hover{background:#e2e8f0}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);font-size:.9rem}
@media (max-width:900px){
  .sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .burger-btn{display:flex}
  .content{padding:16px;padding-bottom:120px}
  .topbar{padding:0 16px}
  .view-header h1{font-size:1.4rem}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:1.4rem}
  .modal-content{max-width:100%;border-radius:var(--radius-sm)}
}
@media (max-width:500px){.stats-grid{grid-template-columns:1fr}}
.content::-webkit-scrollbar,.sidebar-nav::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
/* ==================== FICHE BÉNÉVOLE — Accordéons ==================== */

/* Accordéon principal (les 4 grands blocs) */
.acc-main {
    border: none;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
}

.acc-main-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: white;
    cursor: pointer;
    transition: all 0.2s ease;
}

.acc-main-header:hover {
    background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
}

.acc-main-header.open {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
}

.acc-main-icon {
    font-size: 1.4rem;
    flex-shrink: 0;
}

.acc-main-title {
    flex: 1;
    font-weight: 800;
    font-size: 0.98rem;
    letter-spacing: -0.01em;
}

.acc-main-subtitle {
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 2px;
    font-weight: 400;
}

.acc-main-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 0.75rem;
    font-weight: 800;
}

.acc-main-badge.vide {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.5);
}

.acc-main-arrow {
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.7);
    transition: transform 0.2s ease;
}

.acc-main-body {
    padding: 14px 16px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-top: none;
    border-radius: 0 0 12px 12px;
}

/* Sous-catégorie (ex : Numérique, Petit bricolage) */
.acc-sub {
    border: 1px solid #e2e8f0;
    border-left: 4px solid #cbd5e1;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    background: #f8fafc;
    transition: all 0.2s ease;
}

.acc-sub.avec-selection {
    border-left-color: #2563eb;
    background: #f0f9ff;
}

.acc-sub-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 700;
    color: #1e293b;
}

.acc-sub-header:hover {
    background: rgba(37, 99, 235, 0.05);
}

.acc-sub-icon {
    font-size: 1.1rem;
    flex-shrink: 0;
}

.acc-sub-title {
    flex: 1;
}

.acc-sub-badge {
    background: var(--accent);
    color: white;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
    min-width: 22px;
    text-align: center;
}

.acc-sub-arrow {
    font-size: 0.72rem;
    color: #64748b;
}

.acc-sub-body {
    padding: 8px 12px 10px;
    background: #fff;
    border-top: 1px solid #e2e8f0;
}

/* Petit sous-titre interne (Fréquence, Créneaux, Zone) */
.acc-inner-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #64748b;
    font-weight: 800;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.acc-inner-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
}
/* ==================== PARAMÈTRES — Onglets ==================== */
.param-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
}
.param-tabs::-webkit-scrollbar { height: 6px; }
.param-tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.param-tab {
    flex-shrink: 0;
    padding: 10px 16px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    white-space: nowrap;
}
.param-tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #f8fafc;
}
.param-tab.active {
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
}

.param-panel { display: none; }
.param-panel.active { display: block; animation: fadeIn .25s ease; }

@media (max-width: 600px) {
    .param-tab { padding: 8px 12px; font-size: 0.8rem; }
}
/* ==================== CARTES STATS CLIQUABLES ==================== */
.stat-card.clickable {
  cursor: pointer;
  position: relative;
  padding-bottom: 26px;
}
.stat-card.clickable::after {
  content: '→';
  position: absolute;
  bottom: 8px;
  right: 14px;
  font-size: 1.1rem;
  color: var(--text-muted);
  opacity: .55;
  transition: all .2s;
}
@media (hover: hover) {
  .stat-card.clickable:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent);
  }
  .stat-card.clickable:hover::after {
    opacity: 1;
    color: var(--accent);
    transform: translateX(3px);
  }
}
.stat-card.clickable.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, .18);
}
.stat-card.clickable.active::after {
  content: '✓';
  color: var(--accent);
  opacity: 1;
  font-weight: 800;
}
.stat-card.clickable:active {
  transform: scale(.97);
  transition: transform .08s;
}
</style>
</head>
<body>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">🧰</div>
    <div class="sidebar-logo-text">
      <strong>Gestion BricoBol</strong>
      <small>Espace bureau</small>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <span>v0.5</span>
    <span id="storageInfo">Supabase</span>
  </div>
</aside>

<div class="overlay" id="overlay" onclick="BricoBol.closeSidebar()"></div>

<main class="main">
  <header class="topbar">
    <button class="burger-btn" onclick="BricoBol.toggleSidebar()" aria-label="Menu">☰</button>
    <h1 class="topbar-title" id="topbarTitle">Tableau de bord</h1>
    <button id="btnRecharger" onclick="BricoBol.recharger()" title="Recharger depuis le serveur" style="background:none;border:none;font-size:1.3rem;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--text);">🔄</button>
  </header>

  <div id="pauseBandeau" style="display:none;"></div>
  <div id="syncBandeau" style="display:none;"></div>

  <div class="content" id="contentArea"></div>
</main>
</div>

<div id="modalsContainer"></div>

<!-- Modale de connexion Supabase -->
<div id="supaLoginModal" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:3rem;">🧰</div>
      <h1 style="margin:12px 0 4px;font-size:1.4rem;font-weight:800;">Gestion BricoBol</h1>
      <p style="color:#64748b;font-size:.85rem;margin:0;">Connexion requise</p>
    </div>
    <form id="supaLoginForm">
      <div style="margin-bottom:14px;">
        <label style="display:block;font-weight:600;font-size:.82rem;margin-bottom:6px;">Email</label>
        <input type="email" id="supaEmail" required autocomplete="username" style="width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:inherit;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-weight:600;font-size:.82rem;margin-bottom:6px;">Mot de passe</label>

<script>
// ============================================================
// MODULE : STORAGE — Cache + Supabase + DELETE + dates vides
// ============================================================

const Storage = {
  PREFIX: 'bricobol_',
  cache: {},
  _charge: false,
  _syncActif: false,
  _fileAttente: [],

  _maps: {
    adherents: {
      aussi_benevole: 'aussiBenevole',
      date_creation: 'dateCreation',
      date_expiration: 'dateExpiration',
      yapla_id: 'yaplaId',
      institution_type: 'institutionType',
      adresse_depart: 'adresseDepart',
      remarque_generale: 'remarqueGenerale',
      condition_seul: 'conditionSeul',
      a_mettre_a_jour: 'aMettreAJour',
      date_ajout: 'dateAjout',
      updated_at: 'updatedAt'
    },
    cotisations: {
      adherent_id: 'adherentId',
      adherent_nom: 'adherentNom',
      compta_id: 'comptaId',
      compta_piece: 'comptaPiece',
      yapla_adhesion_numero: 'yaplaAdhesionNumero',
      date_creation: 'dateCreation',
      date_enregistrement: 'dateEnregistrement',
      date_validation: 'dateValidation',
      date_maj_import: 'dateMajImport',
      updated_at: 'updatedAt'
    },
    entries: {
      don_id: 'donId',
      versement_id: 'versementId',
      updated_at: 'updatedAt'
    },
    interventions: {
      date_creation: 'dateCreation',
      date_prevue: 'datePrevue',
      heure_prevue: 'heurePrevue',
      date_realisee: 'dateRealisee',
      heure_realisee: 'heureRealisee',
      adherent_id: 'adherentId',
      benevole_2: 'benevole2',
      a_relancer: 'aRelancer',
      pris_en_charge_le: 'prisEnChargeLe',
      demarree_le: 'demarreeLe',
      fini_le: 'finiLe',
      km_declares: 'kmDeclares',
      km_valides: 'kmValides',
      remarque_benevole: 'remarqueBenevole',
      validee_le: 'valideeLe',
      deplacement_id: 'deplacementId',
      updated_at: 'updatedAt'
    },
    deplacements: {
      date_remboursement: 'dateRemboursement',
      compta_id: 'comptaId',
      compta_piece: 'comptaPiece',
      mode_remboursement: 'modeRemboursement',
      note_remboursement: 'noteRemboursement',
      updated_at: 'updatedAt'
    },
    dons: {
      numero_donateur: 'numeroDonateur',
      adherent_id: 'adherentId',
      montant_total: 'montantTotal',
      nombre_dons: 'nombreDons',
      intervention_id: 'interventionId',
      intervention_numero: 'interventionNumero',
      recu_demande: 'recuDemande',
      recu_numero: 'recuNumero',
      recu_genere: 'recuGenere',
      date_recu: 'dateRecu',
      recette_generee: 'recetteGeneree',
      compta_ids: 'comptaIds',
      date_import: 'dateImport',
      updated_at: 'updatedAt'
    },
    evenements: {
      type_evenement: 'typeEvenement',
      heure_fin: 'heureFin',
      updated_at: 'updatedAt'
    },
    documents: {
      updated_at: 'updatedAt'
    }
  },

  // Convertit un objet app → SQL (camelCase → snake_case)
  // + FIX : convertit les chaînes vides "" en null pour les colonnes DATE
  _versSQL(table, obj) {
    const map = this._maps[table] || {};
    const out = { ...obj };
    if (out.id !== undefined) out.id = String(out.id);
    for (const sqlKey in map) {
      const appKey = map[sqlKey];
      if (out[appKey] !== undefined) {
        out[sqlKey] = out[appKey];
        delete out[appKey];
      }
    }
    // ✅ Convertir "" en null pour les colonnes DATE/TIMESTAMP
    const dateFields = [
      'date', 'date_creation', 'date_expiration', 'date_ajout',
      'date_enregistrement', 'date_validation', 'date_maj_import',
      'date_prevue', 'date_realisee', 'date_remboursement',
      'date_recu', 'date_import', 'updated_at'
    ];
    dateFields.forEach(f => {
      if (out[f] === '') out[f] = null;
    });
    return out;
  },

  // Convertit un objet SQL → app (snake_case → camelCase)
  // + reconvertit les id en nombres
  _versApp(table, obj) {
    const map = this._maps[table] || {};
    const out = { ...obj };
    for (const sqlKey in map) {
      const appKey = map[sqlKey];
      if (out[sqlKey] !== undefined) {
        out[appKey] = out[sqlKey];
        delete out[sqlKey];
      }
    }
    const idFields = ['id', 'adherentId', 'comptaId', 'donId', 'versementId', 'interventionId'];
    idFields.forEach(f => {
      if (out[f] !== undefined && out[f] !== null && typeof out[f] === 'string') {
        const n = Number(out[f]);
        if (!isNaN(n) && String(n) === out[f]) out[f] = n;
      }
    });
    return out;
  },

  // ============================================================
  // CHARGEMENT INITIAL
  // ============================================================

  async chargerToutDepuisSupabase() {
    if (!SupaClient || !SupaClient.client) {
      console.warn('Supabase non connecté — utilisation localStorage');
      this._chargerDepuisLocal();
      return;
    }
    console.log('⏳ Chargement depuis Supabase...');
    const tables = ['adherents', 'cotisations', 'entries', 'interventions', 'deplacements', 'dons', 'evenements', 'documents'];
    for (const t of tables) {
      const rows = await SupaClient.chargerTout(t);
      if (rows === null) {
        this._chargerDepuisLocal();
        return;
      }
      this.cache[t] = rows.map(r => this._versApp(t, r));
    }
    const param = await SupaClient.getSingleton('parametres', 'id', 1);
    this.cache.parametres = param ? (param.data || {}) : {};
    const counter = await SupaClient.getSingleton('counters', 'key', 'adh_counter');
    this.cache.adh_counter = counter ? counter.value : 1;

    this._charge = true;
    this._sauverCacheLocal();
    console.log('✅ Chargé : ' + tables.map(t => t + '=' + (this.cache[t]||[]).length).join(', '));
    this._majBandeau();
  },

  _chargerDepuisLocal() {
    const tables = ['adherents', 'cotisations', 'entries', 'interventions', 'deplacements', 'dons', 'evenements', 'documents'];
    for (const t of tables) {
      this.cache[t] = this._getLocal(t, []);
    }
    this.cache.parametres = this._getLocal('parametres', {});
    this.cache.adh_counter = this._getLocal('adh_counter', 1);
    this._charge = true;
    console.log('📦 Chargé depuis localStorage (cache de secours)');
  },

  _sauverCacheLocal() {
    try {
      for (const t of ['adherents', 'cotisations', 'entries', 'interventions', 'deplacements', 'dons', 'evenements', 'documents', 'parametres', 'adh_counter']) {
        if (this.cache[t] !== undefined) {
          localStorage.setItem(this.PREFIX + t, JSON.stringify(this.cache[t]));
        }
      }
    } catch(e) { console.warn('Cache local plein', e); }
  },

  _getLocal(key, fallback) {
    try {
      const raw = localStorage.getItem(this.PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch(e) { return fallback; }
  },

  _setLocal(key, val) {
    try { localStorage.setItem(this.PREFIX + key, JSON.stringify(val)); } catch(e) {}
  },

  _majBandeau() {
    if (typeof SupaClient !== 'undefined' && SupaClient.renderBandeau) {
      SupaClient.renderBandeau();
    }
  },

  // ============================================================
  // API PUBLIQUE
  // ============================================================

  get(key, fallback = null) {
    if (this.cache[key] !== undefined) return this.cache[key];
    return this._getLocal(key, fallback);
  },

  set(key, value) {
    const ancienneValeur = this.cache[key];
    this.cache[key] = value;
    this._setLocal(key, value);
    this._derniereEcriture = Date.now();
    this._syncVersSupabase(key, value, ancienneValeur);
    return true;
  },

  remove(key) {
    delete this.cache[key];
    localStorage.removeItem(this.PREFIX + key);
    if (SupaClient && SupaClient.client && this._tableDeKey(key)) {
      SupaClient.toutSupprimer(this._tableDeKey(key));
    }
  },

  getAdherents() { return this.get('adherents', []); },
  saveAdherents(list) { this.set('adherents', list); },
  getCounter() { return this.get('adh_counter', 1); },
  saveCounter(n) { this.set('adh_counter', n); },
  getEntries() { return this.get('entries', []); },
  saveEntries(list) { this.set('entries', list); },
  getInterventions() { return this.get('interventions', []); },
  saveInterventions(list) { this.set('interventions', list); },
  getDeplacements() { return this.get('deplacements', []); },
  saveDeplacements(list) { this.set('deplacements', list); },
  getParametres() {
    return this.cache.parametres || this._getLocal('parametres', {
      baremeKm: 0.40, cotisationAnnuelle: 10, exerciceCourant: new Date().getFullYear()
    });
  },
  saveParametres(p) {
    this.cache.parametres = p;
    this._setLocal('parametres', p);
    if (SupaClient && SupaClient.client) {
      SupaClient.setSingleton('parametres', 'id', 1, p);
    }
    return true;
  },

  // ============================================================
  // SYNCHRONISATION
  // ============================================================

  _tableDeKey(key) {
    const map = {
      'adherents': 'adherents',
      'cotisations': 'cotisations',
      'entries': 'entries',
      'interventions': 'interventions',
      'deplacements': 'deplacements',
      'dons': 'dons',
      'evenements': 'evenements',
      'documents': 'documents'
    };
    return map[key] || null;
  },

  async _syncVersSupabase(key, value, ancienneValeur) {
    if (key === 'adh_counter') {
      if (SupaClient && SupaClient.client && SupaClient.enLigne) {
        SupaClient.setCounter('adh_counter', value);
      } else {
        this._fileAttente.push({ key, value, ancienneValeur });
        this._majBandeau();
      }
      return;
    }
    if (key === 'parametres') {
      if (SupaClient && SupaClient.client && SupaClient.enLigne) {
        SupaClient.setSingleton('parametres', 'id', 1, value);
      } else {
        this._fileAttente.push({ key, value, ancienneValeur });
        this._majBandeau();
      }
      return;
    }
    const table = this._tableDeKey(key);
    if (!table) return;

    if (!SupaClient || !SupaClient.client || !SupaClient.enLigne) {
      this._fileAttente.push({ key, value, ancienneValeur });
      console.log('📵 Hors-ligne — modif en attente :', key);
      this._majBandeau();
      return;
    }

    if (Array.isArray(value)) {
      this._syncActif = true;
      this._majBandeau();

      const rows = value.map(item => this._versSQL(table, item));
      const upRes = await SupaClient.upsert(table, rows);

      // DELETE des IDs qui étaient présents avant et plus maintenant
      if (Array.isArray(ancienneValeur) && ancienneValeur.length > 0) {
        const nouveauxIds = new Set(value.map(item => String(item.id)));
        const idsASupprimer = ancienneValeur
          .filter(item => item && item.id !== undefined && item.id !== null)
          .map(item => String(item.id))
          .filter(id => !nouveauxIds.has(id));

        if (idsASupprimer.length > 0) {
          console.log('🗑️ Suppression Supabase : ' + idsASupprimer.length + ' ligne(s) dans ' + table);
          const delRes = await SupaClient.supprimerIds(table, idsASupprimer);
          if (delRes.error) {
            console.error('Erreur DELETE', table, delRes.error);
          }
        }
      }

      this._syncActif = false;
      this._majBandeau();
      if (upRes.error) {
        this._fileAttente.push({ key, value, ancienneValeur });
        this._majBandeau();
      }
    }
  },

  async viderFileAttente() {
    if (this._fileAttente.length === 0) return;
    if (!SupaClient || !SupaClient.client || !SupaClient.enLigne) return;
    console.log('🔄 Vidage file d\'attente : ' + this._fileAttente.length + ' opérations');
    const file = [...this._fileAttente];
    this._fileAttente = [];
    this._majBandeau();
    for (const op of file) {
      await this._syncVersSupabase(op.key, op.value, op.ancienneValeur);
    }
  },

  // ============================================================
  // MIGRATION
  // ============================================================

  async migrerVersSupabase() {
    if (!SupaClient || !SupaClient.client) { alert('Pas connecté à Supabase'); return; }
    if (!SupaClient.enLigne) { alert('Vous êtes hors-ligne. Connectez-vous d\'abord.'); return; }
    if (!confirm('⚠️ Cette opération va envoyer TOUTES vos données locales vers Supabase.\n\nContinuer ?')) return;
    if (!confirm('Confirmation : vos données locales restent intactes, mais elles seront copiées sur le serveur.\n\nConfirmer ?')) return;

    const tables = ['adherents', 'cotisations', 'entries', 'interventions', 'deplacements', 'dons', 'evenements', 'documents'];
    let total = 0;
    const recap = [];

    for (const t of tables) {
      const localData = this._getLocal(t, []);
      if (!Array.isArray(localData) || localData.length === 0) {
        recap.push(`${t}: 0`);
        continue;
      }
      const rows = localData.map(item => this._versSQL(t, item));
      const res = await SupaClient.upsert(t, rows);
      if (!res.error) {
        total += rows.length;
        recap.push(`${t}: ${rows.length}`);
      } else {
        recap.push(`${t}: ERREUR`);
      }
    }

    const param = this._getLocal('parametres', {});
    await SupaClient.setSingleton('parametres', 'id', 1, param);

    const counter = this._getLocal('adh_counter', 1);
    await SupaClient.setCounter('adh_counter', counter);

    localStorage.setItem('bricobol_migre_v1', '1');

    alert(`✅ Migration terminée.\n\n${total} enregistrement(s) envoyé(s).\n\nDétail :\n${recap.join('\n')}`);

    await this.chargerToutDepuisSupabase();
    if (typeof Router !== 'undefined' && Router.currentView) {
      const mod = Router.registry[Router.currentView];
      if (mod && mod.onShow) mod.onShow();
    }
  },

  // ============================================================
  // RESET
  // ============================================================

  async toutVider() {
    if (!confirm('⚠️ Vider TOUT (local + Supabase) ?')) return;
    if (!confirm('Confirmation définitive ?')) return;

    const tables = ['adherents', 'cotisations', 'entries', 'interventions', 'deplacements', 'dons', 'evenements', 'documents'];
    for (const t of tables) {
      if (SupaClient && SupaClient.client) await SupaClient.toutSupprimer(t);
      localStorage.removeItem(this.PREFIX + t);
      this.cache[t] = [];
    }
    if (SupaClient && SupaClient.client) {
      await SupaClient.setSingleton('parametres', 'id', 1, {});
      await SupaClient.setCounter('adh_counter', 1);
    }
    localStorage.removeItem(this.PREFIX + 'parametres');
    localStorage.removeItem(this.PREFIX + 'adh_counter');
    this.cache.parametres = {};
    this.cache.adh_counter = 1;

    alert('✅ Tout est vidé.');
    location.reload();
  }
};

// ============================================================
// RAFRAÎCHISSEMENT AUTO
// ============================================================

let _dernierFocusRechargement = 0;

window.addEventListener('focus', async () => {
  if (!Storage._charge) return;
  if (typeof SupaClient === 'undefined' || !SupaClient.client) return;
  if (!SupaClient.enLigne) return;
  if (Date.now() - _dernierFocusRechargement < 30000) return;
  if (Storage._derniereEcriture && (Date.now() - Storage._derniereEcriture) < 8000) {
    console.log('⏭️ Focus ignoré (écriture récente)');
    return;
  }
  if (Storage._syncActif) {
    console.log('⏭️ Focus ignoré (sync en cours)');
    return;
  }
  _dernierFocusRechargement = Date.now();
  console.log('🔄 Retour de focus → rechargement');
  await Storage.chargerToutDepuisSupabase();
  if (typeof Router !== 'undefined' && Router.currentView) {
    const mod = Router.registry[Router.currentView];
    if (mod && mod.onShow) mod.onShow();
  }
});

window.addEventListener('online', async () => {
  console.log('🌐 Retour en ligne');
  if (typeof SupaClient !== 'undefined') {
    SupaClient.enLigne = true;
    SupaClient.renderBandeau();
  }
  await Storage.viderFileAttente();
});

window.addEventListener('offline', () => {
  console.log('📵 Hors-ligne');
  if (typeof SupaClient !== 'undefined') {
    SupaClient.enLigne = false;
    SupaClient.renderBandeau();
  }
});
</script>
<script>
// ============================================================
// MODULE : UTILS — Fonctions utilitaires
// ============================================================
// Dates, formatage, échappement HTML, calculs de statuts.

const Utils = {

  // --- Dates ---
  todayISO() {
    return new Date().toISOString().split('T')[0];
  },

  addOneYear(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    d.setFullYear(d.getFullYear() + 1);
    return d.toISOString().split('T')[0];
  },

  formatDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  },

  daysUntil(iso) {
    if (!iso) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const exp = new Date(iso); exp.setHours(0, 0, 0, 0);
    return Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
  },

  // --- Statut adhérent (actif / bientôt / expiré) ---
  statutAdherent(dateExpiration) {
    const d = this.daysUntil(dateExpiration);
    if (d === null) return 'actif';
    if (d < 0) return 'expire';
    if (d <= 60) return 'bientot';
    return 'actif';
  },

  statutLabel(s) {
    return { actif: 'À jour', bientot: 'Expire bientôt', expire: 'Expiré' }[s] || s;
  },

  statutBadge(s) {
    const map = { actif: 'badge-success', bientot: 'badge-warning', expire: 'badge-danger' };
    return `<span class="badge ${map[s] || 'badge-neutral'}">${this.statutLabel(s)}</span>`;
  },

  // --- Sécurité HTML ---
  escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  },

  // --- Formatage monétaire ---
  formatEuro(n) {
    if (n == null || isNaN(n)) return '0,00 €';
    return Number(n).toFixed(2).replace('.', ',') + ' €';
  },

  // --- Formatage kilométrique ---
  formatKm(n) {
    if (n == null || isNaN(n)) return '0 km';
    return Number(n).toFixed(1).replace('.', ',') + ' km';
  },

  // --- ID unique simple ---
  uid() {
    return Date.now() + Math.random();
  }
};
</script>
<script>
// ============================================================
// MODULE : ROUTER — Navigation + injection dynamique des vues
// ============================================================

const Router = {

  registry: {},
  currentView: null,

  register(moduleConfig) {
    this.registry[moduleConfig.view] = moduleConfig;
  },

  buildMenu() {
    const sections = {};
    Object.values(this.registry).forEach(m => {
      const s = m.section || 'Autres';
      if (!sections[s]) sections[s] = [];
      sections[s].push(m);
    });

    const sectionOrder = ['Vue d\'ensemble', 'Activité', 'Gestion', 'Autres'];

    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = '';

    sectionOrder.forEach(sectionName => {
      const items = sections[sectionName];
      if (!items || items.length === 0) return;
      items.sort((a, b) => (a.order || 100) - (b.order || 100));

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'nav-section';
      sectionDiv.innerHTML = `<div class="nav-section-title">${sectionName}</div>`;

      items.forEach(m => {
        const link = document.createElement('a');
        link.className = 'nav-item';
        link.dataset.view = m.view;
        link.innerHTML = `<span class="nav-item-icon">${m.icon}</span><span>${m.title}</span>`;
        link.addEventListener('click', () => this.go(m.view));
        sectionDiv.appendChild(link);
      });

      nav.appendChild(sectionDiv);
    });
  },

  // ✅ MODIFIÉ : accepte un 2e paramètre "params" transmis à onShow
  go(viewName, params = null) {
    const module = this.registry[viewName];
    if (!module) {
      console.warn('Module introuvable :', viewName);
      return;
    }

    this.mountIfNeeded(viewName, module);

    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    const view = document.getElementById('view-' + viewName);
    const navItem = document.querySelector('.nav-item[data-view="' + viewName + '"]');
    if (view) view.classList.add('active');
    if (navItem) navItem.classList.add('active');

    document.getElementById('topbarTitle').textContent = module.title;

    try { localStorage.setItem('bricobol_active_view', viewName); } catch(e){}

    if (typeof BricoBol !== 'undefined' && BricoBol.closeSidebar) {
      BricoBol.closeSidebar();
    }

    const c = document.getElementById('contentArea');
    if (c) c.scrollTop = 0;

    this.currentView = viewName;

    // Met à jour le hash d'URL sans déclencher hashchange
    try {
      const hashCible = '#' + viewName;
      if (window.location.hash !== hashCible) {
        history.replaceState(null, '', hashCible);
      }
    } catch (e) {}

    // ✅ Passe les params à onShow
    if (module.onShow) module.onShow(params);
  },

  mountIfNeeded(viewName, module) {
    const viewId = 'view-' + viewName;
    if (document.getElementById(viewId)) return;

    if (module.getViewHTML) {
      const html = module.getViewHTML();
      document.getElementById('contentArea').insertAdjacentHTML('beforeend', html);
    }

    if (module.getModalsHTML) {
      const modals = module.getModalsHTML();
      document.getElementById('modalsContainer').insertAdjacentHTML('beforeend', modals);
    }

    if (module.mount) module.mount();
  },

  _getViewFromHash() {
    const hash = (window.location.hash || '').replace(/^#/, '');
    if (!hash) return null;
    return this.registry[hash] ? hash : null;
  },

  init() {
    this.buildMenu();
    const hashView = this._getViewFromHash();
    const saved = localStorage.getItem('bricobol_active_view') || 'dashboard';
    const target = hashView || (this.registry[saved] ? saved : 'dashboard');
    this.go(target);
    window.addEventListener('hashchange', () => {
      const h = this._getViewFromHash();
      if (h && h !== this.currentView) this.go(h);
    });
  }
};

<script>
// ============================================================
// MODULE : SUPA-CLIENT — Connexion + CRUD + pause detection
// ============================================================

const SupaClient = {
  url: 'https://qhdrzapdcvjvjkzagkza.supabase.co',
  key: 'sb_publishable_AEEocm-2pofdWsumlxS83Q_0mesUy9R',
  projectRef: 'qhdrzapdcvjvjkzagkza',
  client: null,
  user: null,
  enLigne: false,
  enPause: false,

  async init() {
    if (typeof supabase === 'undefined') {
      console.error('❌ supabase-js non chargé');
      this.enLigne = false;
      return;
    }
    this.client = supabase.createClient(this.url, this.key, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    window.addEventListener('online', () => { this.enLigne = true; this.renderBandeau(); });
    window.addEventListener('offline', () => { this.enLigne = false; this.renderBandeau(); });
    this.enLigne = navigator.onLine;

    const { data: { session } } = await this.client.auth.getSession();
    if (session && session.user) {
      this.user = session.user;
      this._masquerLogin();
      this.renderBandeau();
      return;
    }

    this._afficherLogin();
    return new Promise(resolve => { this._resolveLogin = resolve; });
  },

  async login(email, password, souvenir) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    this.user = data.user;
    if (souvenir) {
      localStorage.setItem('bricobol_supa_creds', JSON.stringify({ email, password }));
    }
    this._masquerLogin();
    this.renderBandeau();
    if (this._resolveLogin) this._resolveLogin();
  },

  async logout() {
    if (!confirm('Se déconnecter ?')) return;
    await this.client.auth.signOut();
    localStorage.removeItem('bricobol_supa_creds');
    this.user = null;
    location.reload();
  },

  // ============================================================
  // CRUD générique
  // ============================================================

  async chargerTout(table) {
    const { data, error } = await this.client.from(table).select('*');
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur SELECT', table, error);
      return null;
    }
    return data;
  },

  async upsert(table, rows, conflictKey = 'id') {
    if (!rows || rows.length === 0) return { error: null };
    const { error } = await this.client.from(table).upsert(rows, { onConflict: conflictKey });
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur UPSERT', table, error);
    }
    return { error };
  },

  async supprimerIds(table, ids) {
    if (!ids || ids.length === 0) return { error: null };
    const { error } = await this.client.from(table).delete().in('id', ids);
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur DELETE', table, error);
    }
    return { error };
  },

  async toutSupprimer(table) {
    const { error } = await this.client.from(table).delete().neq('id', '___jamais___');
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur DELETE ALL', table, error);
    }
    return { error };
  },

  async getSingleton(table, idKey, idValue) {
    const { data, error } = await this.client.from(table).select('*').eq(idKey, idValue).single();
    if (error && error.code !== 'PGRST116') {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur SELECT singleton', table, error);
    }
    return data || null;
  },
  async setCounter(key, value) {
    const payload = { key, value, updated_at: new Date().toISOString() };
    const { error } = await this.client.from('counters').upsert(payload, { onConflict: 'key' });
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur UPSERT counter', key, error);
    }
    return { error };
  },

  async setSingleton(table, idKey, idValue, data) {
    const payload = { [idKey]: idValue, data, updated_at: new Date().toISOString() };
    const { error } = await this.client.from(table).upsert(payload, { onConflict: idKey });
    if (error) {
      if (this.estEnPause(error)) this.afficherPause();
      console.error('Erreur UPSERT singleton', table, error);
    }
    return { error };
  },

  // ============================================================
  // DÉTECTION DE PAUSE
  // ============================================================

  estEnPause(error) {
    if (!error) return false;
    const msg = (error.message || '').toLowerCase();
    const code = String(error.code || '');
    return (
      msg.includes('paused') ||
      msg.includes('pause') ||
      msg.includes('project is paused') ||
      msg.includes('inactive') ||
      error.status === 503 ||
      code === 'PGRST503'
    );

  afficherPause() {
    if (this.enPause) return;
    this.enPause = true;

    try {

        alert('⚠️ La base est toujours en pause.\n\nAllez sur supabase.com et cliquez sur « Restore project ».');
      } else if (error) {
        alert('Erreur : ' + (error.message || 'inconnue'));
      } else {
        this.masquerPause();
        alert('✅ Connexion rétablie ! Le bandeau disparaît.');
        // Recharger les données
        if (typeof Storage !== 'undefined') {
          await Storage.chargerToutDepuisSupabase();
          if (typeof Router !== 'undefined' && Router.currentView) {
            const mod = Router.registry[Router.currentView];
            if (mod && mod.onShow) mod.onShow();
          }
        }
      }
    } catch (e) {
      alert('Erreur : ' + e.message);

    }
  },

  renderBandeauPause() {

    // Récupérer les identifiants mémorisés
    let email = 'bricobol.asso@proton.me';
    let password = '';
    try {
      const creds = JSON.parse(localStorage.getItem('bricobol_supa_creds') || '{}');
      if (creds.email) email = creds.email;

    } catch(e) {}

    const aPassword = password ? true : false;
    const passwordMasque = aPassword ? '•'.repeat(password.length) : '(non mémorisé)';

      <div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;">

          <button onclick="SupaClient.copier('${email.replace(/'/g, "\\'")}', this)" style="padding:6px 12px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:700;">📋 Copier</button>

    // Stocker le vrai mot de passe dans un dataset pour le copier/révéler
    const elPass = document.getElementById('pausePassword');

  togglePassword() {

    el.textContent = revele ? el.dataset.masque : el.dataset.real;
    el.dataset.revele = revele ? '0' : '1';
  },

  copier(texte, btn) {
    if (!texte) return;
    const afficherOk = () => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte).then(afficherOk).catch(() => {
        this._copieFallback(texte); afficherOk();
      });
    } else {
      this._copieFallback(texte); afficherOk();
    }
  },

  _copieFallback(texte) {
    const ta = document.createElement('textarea');
    ta.value = texte;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);

  // ============================================================

  _afficherLogin() {

    if (modal) modal.style.display = 'none';

  renderBandeau() {

    const fileAttente = (typeof Storage !== 'undefined' && Storage._fileAttente) ? Storage._fileAttente.length : 0;

    let bg, border, color, icon, texte;

    if (!enLigne && fileAttente > 0) {
      bg = '#fef2f2'; border = '#fecaca'; color = '#991b1b';

      bg = '#eff6ff'; border = '#bfdbfe'; color = '#1e40af';
      icon = '⏳';
      texte = 'Synchronisation…';
    } else {
      el.style.display = 'none';

      display:flex;align-items:center;gap:10px;padding:8px 14px;

};

// Branchement du formulaire de connexion
window.addEventListener('DOMContentLoaded', () => {

        msg = 'Email ou mot de passe incorrect.';
      }
      errEl.textContent = msg;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  });

const BricoBol = {

  toggleSidebar() {

    document.getElementById('overlay').classList.toggle('active');
  },

  closeSidebar() {
    const s = document.getElementById('sidebar');
    const o = document.getElementById('overlay');

    if (o) o.classList.remove('active');
